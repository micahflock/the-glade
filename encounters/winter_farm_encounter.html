<!DOCTYPE html>
<html lang="en" class="accent-ochre">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1B1308">
<title>Encounter — Winter Farm Encounter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Lora:ital,wght@0,400;0,500;0,600;0,700&family=JetBrains+Mono:wght@400;500;600;700&family=Special+Elite&display=swap">
<style>
/* ============================================================
   THE GLADE — Encounter Worksheet (dark-parchment plate)
   iPad-first landscape DM tool.
   ============================================================ */

:root {
  /* ─ Grounds: night plate ─ */
  --night-0:        #100B05;   /* deepest, page edge */
  --night-1:        #1B1308;   /* primary ground */
  --night-2:        #241A0E;   /* card surface */
  --night-3:        #2F2314;   /* hover / nested card */
  --night-4:        #3B2C1B;   /* active row */

  /* ─ Inks (warm parchment on night) ─ */
  --ink:            #EBDCB5;   /* primary */
  --ink-dim:        #C9B383;   /* secondary */
  --ink-mute:       #8E7549;   /* tertiary, metadata */
  --ink-ghost:      #5C4827;   /* near-invisible */

  /* ─ Rules ─ */
  --rule:           #4A3820;
  --rule-faint:     #322517;
  --rule-strong:    #6F5530;

  /* ─ Accent palette (Glade earth tones) ─ */
  --ochre:          #D69A45;
  --ochre-deep:     #8C5E1C;
  --vermilion:      #C44A30;
  --vermilion-deep: #7A1F12;
  --moss:           #8A9A4A;
  --moss-deep:      #44502A;
  --lapis:          #5A7FA3;
  --lapis-deep:     #2F4F6F;
  --cochineal:      #B04050;
  --cochineal-deep: #5A1A24;
  --umber:          #A06A3A;
  --umber-deep:     #4A2E14;

  /* ─ Semantic ─ */
  --accent:         var(--ochre);
  --accent-deep:    var(--ochre-deep);
  --danger:         var(--vermilion);
  --good:           var(--moss);

  /* ─ Type ─ */
  --font-display:   "IM Fell English", "EB Garamond", Georgia, serif;
  --font-label:     "IM Fell English SC", "EB Garamond", Georgia, serif;
  --font-plate:     "EB Garamond", "Hoefler Text", Georgia, serif;
  --font-body:      "Lora", "Iowan Old Style", Georgia, serif;
  --font-mono:      "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --font-hand:      "Special Elite", "Courier Prime", "Courier New", monospace;

  /* ─ Spacing ─ */
  --s-1: 4px;  --s-2: 8px;  --s-3: 12px; --s-4: 16px;
  --s-5: 24px; --s-6: 32px; --s-7: 48px;

  /* ─ Sizing (density tweakable) ─ */
  --row-pad-y:      6px;
  --row-pad-x:      10px;
  --row-gap:        4px;
  --base-fs:        15px;
}

.accent-ochre     { --accent: var(--ochre);     --accent-deep: var(--ochre-deep);     }
.accent-vermilion { --accent: var(--vermilion); --accent-deep: var(--vermilion-deep); }
.accent-moss      { --accent: var(--moss);      --accent-deep: var(--moss-deep);      }
.accent-lapis     { --accent: var(--lapis);     --accent-deep: var(--lapis-deep);     }
.accent-cochineal { --accent: var(--cochineal); --accent-deep: var(--cochineal-deep); }
.accent-umber     { --accent: var(--umber);     --accent-deep: var(--umber-deep);     }

/* Density */
.density-roomy   { --row-pad-y: 10px; --row-pad-x: 14px; --row-gap: 8px; }
.density-compact { --row-pad-y: 4px;  --row-pad-x: 8px;  --row-gap: 3px; }

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--night-1);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--base-fs);
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: rgba(0,0,0,0);
}
button { font: inherit; cursor: pointer; color: inherit; }
input { font: inherit; }
::selection { background: var(--accent); color: var(--night-0); }
h1, h2, h3 { margin: 0; font-weight: 400; }

/* parchment texture overlay — sparse foxing on the dark plate */
body::before {
  content: "";
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.6  0 0 0 0 0.5  0 0 0 0 0.3  0 0 0 0.05 0'/></filter><rect width='400' height='400' filter='url(%23n)'/></svg>");
  opacity: 0.5;
  mix-blend-mode: overlay;
}
body > * { position: relative; z-index: 1; }

/* ─── Topbar ────────────────────────────────────────────────── */
.topbar {
  position: sticky; top: 0; z-index: 50;
  background: linear-gradient(to bottom, var(--night-0), var(--night-1));
  border-bottom: 1px solid var(--rule);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 18px;
  gap: 18px;
}
.topbar-title {
  display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap;
}
.topbar-title h1 { white-space: nowrap; }
.topbar-title .eyebrow {
  font-family: var(--font-label);
  font-size: 10px;
  letter-spacing: 0.22em;
  color: var(--ink-mute);
  text-transform: uppercase;
}
.topbar-title h1 {
  font-family: var(--font-display);
  font-size: 26px;
  line-height: 1;
  color: var(--ink);
  letter-spacing: 0.01em;
  font-weight: 400;
}
.topbar-title h1 em { font-style: italic; color: var(--accent); }
.round-tag {
  font-family: var(--font-label);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-dim);
  border: 1px solid var(--rule);
  padding: 3px 10px;
  background: var(--night-2);
  white-space: nowrap;
}
.round-tag strong {
  font-family: var(--font-mono);
  font-weight: 700;
  color: var(--accent);
  margin-left: 4px;
  font-variant-numeric: tabular-nums;
}
.topbar-actions { display: flex; gap: 6px; align-items: center; }
.topbar-actions button {
  font-family: var(--font-label);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  padding: 8px 14px;
  background: var(--night-2);
  color: var(--ink-dim);
  border: 1px solid var(--rule);
  min-height: 38px;
}
.topbar-actions button:hover { color: var(--ink); border-color: var(--accent); }
.topbar-actions button:active { background: var(--night-3); }
.topbar-actions button.primary {
  background: var(--accent);
  color: var(--night-0);
  border-color: var(--accent);
  font-weight: 700;
}
.topbar-actions button.primary:hover { background: var(--accent-deep); color: var(--ink); }
.topbar-actions button.icon { padding: 8px 12px; }
.topbar-actions .sep { width: 1px; height: 24px; background: var(--rule); margin: 0 4px; }

/* ─── Main grid (landscape iPad first) ──────────────────────── */
.app {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(560px, 46%);
  gap: 18px;
  padding: 16px 18px;
  align-items: start;
}

/* ─── Initiative tracker ────────────────────────────────────── */
.tracker {
  background: transparent;
}
.section-head {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 12px;
  margin-bottom: 8px;
  padding: 0 2px;
}
.section-head h2 {
  font-family: var(--font-label);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--ink-dim);
}
.section-head .hint {
  font-family: var(--font-hand);
  font-size: 11px;
  color: var(--ink-mute);
  font-style: italic;
}

/* Muster bar — dial NPC counts at the table */
#muster:empty { display: none; }
#muster {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
  margin-bottom: 10px; padding: 8px 10px;
  border: 1px solid var(--rule); border-radius: 3px;
  background: var(--night-1, rgba(0,0,0,0.15));
}
.muster-label {
  font-family: var(--font-label);
  font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--ink-mute); margin-right: 4px;
}
.muster-item {
  display: inline-flex; align-items: center; gap: 0;
  border: 1px solid var(--rule); border-radius: 3px; overflow: hidden;
}
.muster-item .mus-name {
  font-size: 12px; color: var(--ink-dim);
  padding: 4px 8px; white-space: nowrap;
}
.muster-item .mus-count {
  font-family: var(--font-label);
  font-size: 13px; min-width: 22px; text-align: center;
  padding: 4px 2px; color: var(--ink);
  border-left: 1px solid var(--rule-faint);
  border-right: 1px solid var(--rule-faint);
}
.muster-item.none .mus-count { color: var(--ink-ghost); }
.muster-item button {
  background: none; border: none; cursor: pointer;
  color: var(--ink-dim); font-size: 15px; line-height: 1;
  padding: 5px 9px; min-width: 30px;
}
.muster-item button:hover { background: var(--rule-faint); color: var(--accent); }
.muster-item button:disabled { color: var(--ink-ghost); cursor: default; background: none; }

#tracker-rows {
  display: flex;
  flex-direction: column;
  gap: var(--row-gap);
}

.row {
  display: grid;
  grid-template-columns: 48px minmax(220px, auto) minmax(0, 1fr) 96px auto;
  gap: 10px;
  align-items: center;
  padding: var(--row-pad-y) var(--row-pad-x);
  background: var(--night-2);
  border: 1px solid var(--rule);
  border-left: 3px solid var(--rule-strong);
  position: relative;
}
.row > .info { min-width: 0; }
.row > .row-pills {
  display: flex; flex-wrap: wrap; gap: 4px;
  align-self: center;
  min-width: 0;
}
.row > .row-pills .pill {
  font-family: var(--font-label);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  background: var(--vermilion-deep);
  color: var(--ink);
  border: 1px solid var(--vermilion);
  padding: 2px 8px;
  line-height: 1.2;
}
.row.npc { border-left-color: var(--accent); }
.row.pc  { border-left-color: var(--good); }
.row.active {
  background: var(--night-4);
  border-color: var(--accent);
  border-left-width: 4px;
  box-shadow: inset 0 0 0 1px var(--accent-deep);
}
.row.focused:not(.active) {
  border-color: var(--ink-dim);
  background: var(--night-3);
}
.row.acted:not(.active) {
  opacity: 0.55;
}
.row.acted:not(.active) .name { color: var(--ink-mute); }
.row.dead {
  opacity: 0.4;
  background: var(--night-1);
  border-left-color: var(--rule);
}
.row.dead .name { text-decoration: line-through; color: var(--ink-mute); }

/* Init pill */
.row .init {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 20px;
  text-align: center;
  color: var(--ink);
  background: var(--night-0);
  border: 1px solid var(--rule);
  padding: 6px 0;
  width: 52px;
  height: 44px;
  -webkit-appearance: none;
  appearance: none;
  outline: none;
  font-variant-numeric: tabular-nums;
}
.row .init.empty { background: var(--night-1); color: var(--ink-mute); }
.row .init:focus {
  background: var(--night-2);
  border-color: var(--accent);
  color: var(--accent);
}
.row .init::placeholder { color: var(--ink-ghost); opacity: 1; }
.row.active .init { background: var(--accent); color: var(--night-0); border-color: var(--accent); }

/* Info column */
.row .info { min-width: 0; cursor: pointer; }
.row .name {
  font-family: var(--font-display);
  font-size: 17px;
  line-height: 1.15;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.row .name .group-tag {
  font-family: var(--font-label);
  font-size: 10px;
  color: var(--ink-mute);
  margin-left: 6px;
  letter-spacing: 0.1em;
}
.row .meta {
  display: flex; flex-wrap: wrap; gap: 6px 10px;
  margin-top: 2px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-dim);
  font-variant-numeric: tabular-nums;
  align-items: center;
}
.row .meta .ac { color: var(--ink); font-weight: 700; }
.row .meta .ac::before { content: "AC "; color: var(--ink-mute); font-weight: 400; }
.row .meta .speed { color: var(--ink-dim); }
.row .meta .init-mod {
  background: var(--night-0);
  border: 1px solid var(--rule);
  color: var(--good);
  padding: 0 6px;
  font-weight: 700;
}
.row .meta .init-mod::before { content: "INIT "; color: var(--ink-mute); font-weight: 400; }

/* HP column */
.hp-col {
  display: flex; flex-direction: column; gap: 3px; align-items: stretch;
  min-width: 96px;
}
.hp-display {
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
  white-space: nowrap;
  line-height: 1;
  text-align: right;
}
.hp-display .sep { color: var(--ink-mute); font-weight: 400; }
.hp-display .max { color: var(--ink-dim); font-weight: 500; }
.hp-display.low { color: var(--ochre); }
.hp-display.bloodied { color: var(--vermilion); }
.hp-display.dead { color: var(--ink-ghost); }
.hp-bar {
  width: 100%;
  height: 4px;
  background: var(--night-0);
  border: 1px solid var(--rule);
  position: relative;
  overflow: hidden;
}
.hp-bar-fill {
  position: absolute; inset: 0 auto 0 0;
  background: var(--good);
  transition: width 0.2s, background 0.2s;
}
.hp-bar-fill.low { background: var(--ochre); }
.hp-bar-fill.bloodied { background: var(--vermilion); }

/* Controls column */
.row .controls {
  display: flex; gap: 4px; align-items: center;
}
.row .controls input.amt {
  width: 44px; height: 32px;
  font-family: var(--font-mono);
  font-size: 13px;
  text-align: center;
  background: var(--night-0);
  color: var(--ink);
  border: 1px solid var(--rule);
  outline: none;
  -moz-appearance: textfield;
}
.row .controls input.amt::-webkit-outer-spin-button,
.row .controls input.amt::-webkit-inner-spin-button {
  -webkit-appearance: none; margin: 0;
}
.row .controls input.amt:focus { border-color: var(--accent); }
.row .controls input.amt::placeholder { color: var(--ink-ghost); }
.row .controls button {
  min-height: 32px;
  min-width: 32px;
  padding: 0 9px;
  border: 1px solid var(--rule);
  background: var(--night-0);
  color: var(--ink-dim);
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 700;
}
.row .controls button:hover { border-color: var(--accent); color: var(--ink); }
.row .controls button.dmg { color: var(--vermilion); border-color: var(--vermilion-deep); }
.row .controls button.dmg:hover { background: var(--vermilion-deep); color: var(--ink); }
.row .controls button.heal { color: var(--moss); border-color: var(--moss-deep); }
.row .controls button.heal:hover { background: var(--moss-deep); color: var(--ink); }
.row .controls button.cond {
  font-family: var(--font-label);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 0 10px;
}
.row .controls button.cond.has { color: var(--vermilion); border-color: var(--vermilion-deep); }
.row .controls button.cond.open { background: var(--accent); color: var(--night-0); border-color: var(--accent); }

/* Conditions popover */
.row .cond-panel {
  grid-column: 1 / -1;
  margin-top: 8px;
  padding: 10px;
  background: var(--night-0);
  border: 1px solid var(--rule);
  display: none;
}
.row .cond-panel.open { display: block; }
.row .cond-panel .pills {
  display: flex; flex-wrap: wrap; gap: 5px;
}
.row .cond-panel .pill-tog {
  font-family: var(--font-label);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  min-height: 30px;
  padding: 0 12px;
  background: var(--night-2);
  color: var(--ink-dim);
  border: 1px solid var(--rule);
}
.row .cond-panel .pill-tog:hover { color: var(--ink); border-color: var(--ink-dim); }
.row .cond-panel .pill-tog.on {
  background: var(--vermilion-deep);
  color: var(--ink);
  border-color: var(--vermilion);
}

/* ─── Active reference panel (sticky right) ─────────────────── */
.active-ref {
  position: sticky;
  top: 74px;
  max-height: calc(100vh - 90px);
  display: flex; flex-direction: column;
  background: var(--night-2);
  border: 1px solid var(--rule-strong);
  box-shadow: inset 0 0 0 1px var(--rule-faint);
  min-height: 480px;
}

.active-ref .empty {
  padding: 40px 24px;
  text-align: center;
  font-family: var(--font-hand);
  color: var(--ink-mute);
  font-style: italic;
}
.active-ref .empty strong {
  display: block;
  font-family: var(--font-display);
  font-style: normal;
  font-size: 20px;
  color: var(--ink-dim);
  margin-bottom: 8px;
  letter-spacing: 0.02em;
}

/* Header inside active ref */
.ar-head {
  padding: 14px 18px 12px;
  border-bottom: 1.5px solid var(--accent);
  flex-shrink: 0;
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  gap: 8px 24px;
}
.ar-head > .ar-head-main {
  flex: 1 1 240px;
  min-width: 0;
}
.ar-head .ar-eyebrow {
  flex: 1 1 100%;
  display: flex; justify-content: space-between; align-items: baseline;
  font-family: var(--font-label);
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.ar-head .ar-eyebrow .kind { color: var(--accent); }
.ar-head .ar-eyebrow .status { color: var(--ink-mute); }
.ar-head .ar-eyebrow .status.pinned { color: var(--ochre); }
.ar-head .ar-eyebrow .status.current { color: var(--accent); }
.ar-head h2 {
  font-family: var(--font-display);
  font-size: 26px;
  line-height: 1.05;
  color: var(--ink);
  letter-spacing: 0.01em;
  margin-bottom: 3px;
}
.ar-head .ar-recharge-row {
  flex: 1 1 100%;
  margin-top: 2px;
}
.ar-head .ar-caption {
  font-family: var(--font-plate);
  font-style: italic;
  font-size: 14px;
  color: var(--ink-dim);
  line-height: 1.3;
}

/* Supplementary header info (senses, pp, spell DC, etc — info NOT in the row) */
.ar-supp {
  margin: 4px 0 0;
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 4px 12px;
  font-size: 13px;
  line-height: 1.4;
  min-width: 0;
  flex: 0 1 auto;
  max-width: 240px;
}
.ar-supp dt {
  font-family: var(--font-label);
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-mute);
  padding-top: 2px;
}
.ar-supp dd {
  margin: 0;
  color: var(--ink);
  font-family: var(--font-body);
}
.ar-supp dd .num {
  font-family: var(--font-mono);
  font-weight: 700;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}
.ar-supp dd.passive .pp-val {
  font-family: var(--font-mono);
  font-weight: 700;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}

/* Stat strip: AC, HP roundels, speed, init */
.ar-stat-strip {
  display: grid;
  grid-template-columns: auto auto 1fr;
  gap: 14px;
  align-items: stretch;
  margin-top: 10px;
}
.ar-roundel {
  display: flex; flex-direction: column; align-items: center;
  padding: 6px 14px;
  background: var(--night-0);
  border: 1px solid var(--rule-strong);
  min-width: 64px;
}
.ar-roundel .label {
  font-family: var(--font-label);
  font-size: 9px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-mute);
}
.ar-roundel .val {
  font-family: var(--font-mono);
  font-size: 22px;
  font-weight: 700;
  color: var(--ink);
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
}
.ar-roundel.hp .val { color: var(--good); }
.ar-roundel.hp .val.low { color: var(--ochre); }
.ar-roundel.hp .val.bloodied { color: var(--vermilion); }
.ar-roundel .sub {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink-mute);
  font-variant-numeric: tabular-nums;
  margin-top: 1px;
}
.ar-meta-grid {

/* Recharge tracker */

/* Ability score table */
.ability-table {

}
.ability-cell {

.ability-cell .ab-mod.neg { color: var(--vermilion); }

  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink-mute);
  font-variant-numeric: tabular-nums;

/* Section blocks within tabs */
.ar-section {
  margin-bottom: 14px;
}
.ar-section:last-child { margin-bottom: 0; }
.ar-section-head {
  font-family: var(--font-label);
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--accent);

  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink-mute);

}

/* Inline key:value pair (saves, skills, senses, etc.) */
.kv-line {
  display: grid;
  grid-template-columns: 90px 1fr;
  gap: 8px;
  margin-bottom: 4px;
  font-size: 13px;
  line-height: 1.4;
}
.kv-line dt {
  font-family: var(--font-label);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-mute);

}
.kv-line dd {
  margin: 0;
  color: var(--ink);
  font-family: var(--font-body);
}
.kv-line dd .num {
  font-family: var(--font-mono);

  color: var(--accent);
  font-variant-numeric: tabular-nums;
}

/* Action entry */
.action-entry {
  margin-bottom: 10px;
  padding-left: 10px;
  border-left: 2px solid var(--rule);
}
.action-entry:last-child { margin-bottom: 0; }
.action-entry.recharge { border-left-color: var(--moss); }

.action-entry .entry-name {

  padding: 1px 5px;

}

.action-entry .entry-text {
  font-size: 13px;
  line-height: 1.5;
  color: var(--ink);
  white-space: pre-line;
}
.action-entry .entry-text .num {
  font-family: var(--font-mono);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: var(--accent);
}

/* Group head for nested action sections (TRAITS, ACTIONS, BONUS, REACTIONS) */
.action-group {
  margin-bottom: 14px;
}
.action-group:last-child { margin-bottom: 0; }
.action-group > .ar-section-head { color: var(--ink-dim); }

/* Tactics tab — readable, hierarchical */
.tactics-entry {
  margin-bottom: 12px;
  padding: 12px 14px;
  background: var(--night-0);
  border: 1px solid var(--rule);
  border-left: 3px solid var(--accent);
}
.tactics-entry .tac-name {
  font-family: var(--font-label);
  font-size: 11px;
  letter-spacing: 0.18em;

/* Notes (PC) */
.pc-notes, .npc-notes {

  border-left: 2px solid var(--ochre);
  font-family: var(--font-hand);

}
.pc-notes::before, .npc-notes::before {

/* Attack rows — table-style hierarchy */
.attack-card {
  margin-bottom: 12px;
  background: var(--night-0);
  border: 1px solid var(--rule);
  border-left: 3px solid var(--accent);
}
.attack-card.recharge { border-left-color: var(--moss); }
.attack-card.recharge.spent { border-left-color: var(--vermilion); opacity: 0.7; }
.attack-card .ac-head {
  display: flex; justify-content: space-between; align-items: baseline;

  flex-wrap: nowrap;
}
.attack-card .ac-name {
  font-family: var(--font-display);
  font-size: 17px;
  color: var(--ink);
  line-height: 1.1;
  flex: 1 1 auto;
  min-width: 0;
}
.attack-card .ac-meta {
  display: flex; align-items: center; gap: 8px;
  flex-shrink: 0;
  white-space: nowrap;
}
.attack-card .ac-type {
  font-family: var(--font-label);
  font-size: 9px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-mute);
  white-space: nowrap;
}
.attack-card .ac-recharge {
  font-family: var(--font-label);
  font-size: 9px;
  letter-spacing: 0.14em;
  color: var(--moss);
  border: 1px solid var(--moss-deep);
  padding: 2px 6px;
  background: var(--night-0);
  text-transform: uppercase;
  white-space: nowrap;
}
.attack-card.spent .ac-recharge { color: var(--vermilion); border-color: var(--vermilion-deep); }
.attack-card .ac-stats {
  display: grid;
  grid-template-columns: auto 1fr 1fr;
  gap: 0;
  border-bottom: 1px solid var(--rule-faint);
}
.attack-card .ac-stat {
  padding: 6px 12px;
  border-right: 1px solid var(--rule-faint);
}
.attack-card .ac-stat:last-child { border-right: 0; }
.attack-card .ac-stat .lab {
  font-family: var(--font-label);
  font-size: 9px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-mute);
  display: block;
  margin-bottom: 2px;
}
.attack-card .ac-stat .val {
  font-family: var(--font-mono);
  font-size: 15px;
  font-weight: 700;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.attack-card .ac-stat.hit .val { color: var(--accent); }
.attack-card .ac-stat.tohit .val { color: var(--good); }
.attack-card .ac-extra {
  padding: 8px 12px 10px;
  font-size: 13px;
  line-height: 1.5;
  color: var(--ink);
}
.attack-card .ac-extra .num {
  font-family: var(--font-mono);
  font-weight: 700;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}
.attack-card.no-stats .ac-stats { display: none; }
.attack-card.no-stats .ac-head { border-bottom: 0; }

/* Encounter notes modal */
.modal-shade {
  display: none;
  position: fixed; inset: 0;
  background: rgba(8, 4, 1, 0.75);
  z-index: 200;
  align-items: center; justify-content: center;
  padding: 32px;
}
.modal-shade.open { display: flex; }
.modal {
  background: var(--night-2);
  border: 1px solid var(--accent);
  box-shadow: 0 12px 48px rgba(0,0,0,0.6), inset 0 0 0 1px var(--rule-faint);
  max-width: 720px;

  max-height: 86vh;
  display: flex; flex-direction: column;
}
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1.5px solid var(--accent);
}
.modal-head h3 {
  font-family: var(--font-display);
  font-size: 22px;
  color: var(--ink);
  letter-spacing: 0.01em;
}
.modal-head .modal-close {
  background: transparent;
  border: 0;
  color: var(--ink-mute);
  font-size: 24px;
  line-height: 1;
  padding: 0 6px;
}
.modal-head .modal-close:hover { color: var(--vermilion); }
.modal-body {
  padding: 16px 18px 22px;
  overflow-y: auto;
}

/* ─── Full reference (below tracker) ────────────────────────── */
.full-ref {
  grid-column: 1 / -1;
  padding: 0 18px 40px;
  margin-top: 8px;
}
.full-ref details {
  background: var(--night-2);
  border: 1px solid var(--rule);
  margin-bottom: 8px;
}
.full-ref summary {
  list-style: none;
  cursor: pointer;
  padding: 10px 16px;
  background: var(--night-0);
  border-bottom: 1px solid var(--rule);
  display: flex; align-items: center; justify-content: space-between;
  font-family: var(--font-label);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-dim);
}
.full-ref summary::-webkit-details-marker { display: none; }
.full-ref summary::after { content: "▼"; font-size: 9px; color: var(--ink-mute); }
.full-ref details[open] summary::after { content: "▲"; }
.full-ref details[open] summary { border-bottom-color: var(--accent); color: var(--ink); }
.full-ref-body { padding: 14px 16px; }

.full-block {
  margin-bottom: 18px;
  padding: 12px 14px;
  background: var(--night-0);
  border: 1px solid var(--rule);
}
.full-block:last-child { margin-bottom: 0; }
.full-block-title {
  font-family: var(--font-display);
  font-size: 18px;
  color: var(--ink);
  margin-bottom: 2px;
}
.full-block-caption {
  font-family: var(--font-plate);

  font-size: 13px;
  color: var(--ink-dim);
  margin-bottom: 8px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--rule);
}

.notes-entry {
  margin-bottom: 12px;
  padding-left: 14px;
  border-left: 2px solid var(--accent);
}
.notes-entry:last-child { margin-bottom: 0; }
.notes-entry .note-label {
  font-family: var(--font-label);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 3px;
}
.notes-entry .note-text {
  font-family: var(--font-body);
  font-size: 13px;
  line-height: 1.55;
  color: var(--ink);
}

/* ─── Tweaks panel ──────────────────────────────────────────── */
#tweaks {
  position: fixed;
  bottom: 16px; right: 16px;
  width: 280px;
  background: var(--night-2);
  border: 1px solid var(--accent);
  box-shadow: 0 6px 24px rgba(0,0,0,0.5), inset 0 0 0 1px var(--rule-faint);
  z-index: 100;

}
#tweaks.open { display: block; }
#tweaks h3 {

  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;

}

}

.tweak-section {

  border-bottom: 1px solid var(--rule-faint);
}
.tweak-section:last-child { border-bottom: 0; }
.tweak-label {
  font-family: var(--font-label);
  font-size: 9px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-mute);
  margin-bottom: 6px;
}
.tweak-swatches { display: flex; gap: 4px; }
.tweak-swatch {
  flex: 1;
  height: 26px;
  border: 1px solid var(--rule);
  cursor: pointer;
  position: relative;
}
.tweak-swatch.on { border: 2px solid var(--ink); }
.tweak-swatch.on::after {
  content: "✓"; position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  color: var(--night-0); font-weight: 900; font-size: 12px;
}
.tweak-radio { display: flex; gap: 4px; }
.tweak-radio button {
  flex: 1;
  font-family: var(--font-label);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 6px 8px;
  background: var(--night-0);
  color: var(--ink-dim);
  border: 1px solid var(--rule);
}
.tweak-radio button.on { background: var(--accent); color: var(--night-0); border-color: var(--accent); }
.tweak-slider { display: flex; align-items: center; gap: 8px; }
.tweak-slider input[type="range"] { flex: 1; accent-color: var(--accent); }
.tweak-slider .val {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink);
  width: 34px; text-align: right;
}

/* ─── Responsive: portrait / narrow ─────────────────────────── */
@media (max-width: 1100px) {
  .app {
    grid-template-columns: 1fr;
  }
  .active-ref {
    position: static;
    max-height: none;
    order: -1;
  }
  .active-ref .ar-body {
    max-height: 360px;
  }
}

@media (max-width: 720px) {
  .row {
    grid-template-columns: 44px minmax(0, 1fr) auto;
  }
  .row > .hp-col { display: none; }
  .row > .row-pills { grid-column: 1 / -1; padding-top: 4px; }
  .topbar-title h1 { font-size: 20px; }
  .topbar-actions button { padding: 6px 10px; font-size: 10px; }
}

/* Print: clean a single page if needed */
@media print {
  .topbar-actions, #tweaks, .row .controls, .row .cond-panel { display: none; }
  .app { display: block; }
  .active-ref { position: static; max-height: none; }
}
