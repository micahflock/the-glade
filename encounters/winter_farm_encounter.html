<script>
/* ============================================================
 * THE GLADE — Encounter Worksheet App
 * Vanilla JS, no external deps. Reads ENCOUNTER global.
 * ============================================================ */

(function () {
  "use strict";

  // ─── Setup ──────────────────────────────────────────────────────────
  if (typeof ENCOUNTER === "undefined" || !ENCOUNTER || !ENCOUNTER.combatants) {
    showBootError("No encounter data found.");
    return;
  }
  const slug = (ENCOUNTER.slug || ENCOUNTER.name || "encounter")
    .replace(/[^a-z0-9]+/gi, "_").toLowerCase();
  const STORAGE_KEY = "encounter:" + slug;
  const TWEAKS_KEY = "encounter-tweaks:" + slug;

  const CONDITIONS = [
    "Blinded", "Charged", "Charmed", "Concentration", "Deafened", "Frightened",
    "Grappled", "Incapacitated", "Invisible", "Kindled", "Paralyzed", "Petrified",
    "Poisoned", "Prone", "Restrained", "Stunned", "Unconscious"
  ];
  const ABILITIES = ["STR", "DEX", "CON", "INT", "WIS", "CHA"];
  const ACCENTS = [
    { id: "ochre",     color: "#D69A45" },
    { id: "vermilion", color: "#C44A30" },
    { id: "moss",      color: "#8A9A4A" },
    { id: "lapis",     color: "#5A7FA3" },
    { id: "cochineal", color: "#B04050" },
    { id: "umber",     color: "#A06A3A" },
  ];

  function showBootError(msg) {
    const box = document.getElementById("boot-error");
    if (box) { box.style.display = "block"; box.textContent = msg; }
  }

  // ─── State ──────────────────────────────────────────────────────────
  function combatantId(c, i) {
    return c.id || (c.name || "c").replace(/[^a-z0-9]+/gi, "_").toLowerCase() + "_" + i;
  }

  // ─── Muster (roster spawning) ───────────────────────────────────────
  // Optional ENCOUNTER.roster lets the DM dial counts at the table instead
  // of baking them into the spec. Each entry:
  //   { id, name, kind?, ac, hp_dice, speed?, init_mod?, notes?, start? }
  const ROSTER = Array.isArray(ENCOUNTER.roster) ? ENCOUNTER.roster : [];

  function rollHp(expr) {
    const m = String(expr == null ? "" : expr).match(/^\s*(\d+)\s*d\s*(\d+)\s*([+-]\s*\d+)?\s*$/i);
    if (!m) {
      const flat = parseInt(expr, 10);
      return Number.isFinite(flat) && flat > 0 ? flat : 1;
    }
    const n = parseInt(m[1], 10), die = parseInt(m[2], 10);
    const bonus = m[3] ? parseInt(m[3].replace(/\s+/g, ""), 10) : 0;
    let total = 0;
    for (let i = 0; i < n; i++) total += 1 + Math.floor(Math.random() * die);
    return Math.max(1, total + bonus);
  }

  function makeCombatant(entry, n) {
    const hp = rollHp(entry.hp_dice);
    return {
      id: String(entry.id) + "_" + n + "_" + Math.random().toString(36).slice(2, 7),
      kind: entry.kind || "npc",
      type_id: String(entry.id),
      type_n: n,
      name: entry.name + " " + n,
      ac: entry.ac,
      hp_max: hp,
      hp_current: hp,
      speed: entry.speed || "",
      initiative: null,
      init_mod: entry.init_mod || "",
      group: null,
      notes: entry.notes || "",
      conditions: []
    };
  }

  function typeCount(list, entry) {
    return list.filter(c => c.type_id === String(entry.id)).length;
  }

  function spawnOne(list, entry) {
    const used = new Set(list.filter(c => c.type_id === String(entry.id)).map(c => c.type_n));
    let n = 1;
    while (used.has(n)) n++;
    list.push(makeCombatant(entry, n));
  }

  function despawnOne(entry) {
    let idx = -1, highest = -Infinity;
    state.combatants.forEach((c, i) => {
      if (c.type_id === String(entry.id) && c.type_n > highest) { highest = c.type_n; idx = i; }
    });
    if (idx < 0) return;
    const gone = state.combatants.splice(idx, 1)[0];
    if (state.activeId === gone.id) state.activeId = null;
    if (state.focusOverride === gone.id) state.focusOverride = null;
    if (state.condPanelOpen === gone.id) state.condPanelOpen = null;
    const ai = state.actedThisRound.indexOf(gone.id);
    if (ai >= 0) state.actedThisRound.splice(ai, 1);
  }

  function defaultState() {
    const combatants = ENCOUNTER.combatants.map((c, i) => ({
      id: combatantId(c, i),
      kind: c.kind || "npc",
      type_id: c.type_id || null,
      type_n: c.type_n || null,
      name: c.name,
      ac: c.ac,
      hp_max: c.hp_max,
      hp_current: (c.hp_current == null) ? c.hp_max : c.hp_current,
      speed: c.speed || "",
      initiative: (c.initiative === undefined ? null : c.initiative),
      init_mod: c.init_mod || "",
      group: c.group || null,
      notes: c.notes || "",
      conditions: Array.isArray(c.conditions) ? c.conditions.slice() : []
    }));
    ROSTER.forEach(entry => {
      const start = parseInt(entry.start, 10);
      for (let i = 0; i < (Number.isFinite(start) ? start : 0); i++) spawnOne(combatants, entry);
    });
    return {
      round: 1,
      activeId: null,
      focusOverride: null,
      activeTab: null,
      actedThisRound: [],
      rechargeSpent: {},
      condPanelOpen: null,
      combatants: combatants
    };
  }
  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      const p = JSON.parse(raw);
      if (!p || !Array.isArray(p.combatants)) return null;
      // back-compat patches
      if (!Array.isArray(p.actedThisRound)) p.actedThisRound = [];
      if (!p.rechargeSpent) p.rechargeSpent = {};
      return p;
    } catch (e) { return null; }
  }
  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }
  let state = loadState() || defaultState();

  // ─── Tweaks state ───────────────────────────────────────────────────
  function defaultTweaks() {
    return { accent: "ochre", density: "default", fontSize: 15 };
  }
  function loadTweaks() {
    try { return Object.assign(defaultTweaks(), JSON.parse(localStorage.getItem(TWEAKS_KEY) || "{}")); }
    catch (e) { return defaultTweaks(); }
  }
  function saveTweaks() {
    try { localStorage.setItem(TWEAKS_KEY, JSON.stringify(tweaks)); } catch (e) {}
  }
  let tweaks = loadTweaks();

  // ─── Helpers ────────────────────────────────────────────────────────
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g,
      m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
  }
  function numClass(text) {
    // Wrap dice/DCs/distances in highlight spans.
    // We MUST do this before escape, otherwise the regex chews into
    // HTML entities like &#39; (apostrophe) and breaks them.
    const PRE  = "\x01N\x01";
    const POST = "\x02N\x02";
    const re = /\b(DC\s*\d+|[+-]?\d+d\d+(?:[+-]\d+)?|\d+\s*\(\d+d\d+(?:[+-]\d+)?\)|[+-]?\d+\s+(?:ft\.|to\s+hit))/g;
    let s = String(text == null ? "" : text).replace(re, m => PRE + m + POST);
    s = esc(s);
    s = s.split(PRE).join('<span class="num">').split(POST).join('</span>');
    return s;
  }
  function sortedCombatants() {
    const list = state.combatants.slice();
    const origIndex = new Map(state.combatants.map((c, i) => [c.id, i]));
    list.sort((a, b) => {
      const ai = (a.initiative == null) ? -Infinity : a.initiative;
      const bi = (b.initiative == null) ? -Infinity : b.initiative;
      if (bi !== ai) return bi - ai;
      return origIndex.get(a.id) - origIndex.get(b.id);
    });
    return list;
  }
  function hpClass(hpCur, hpMax) {
    if (hpCur <= 0) return "dead";
    if (hpCur <= hpMax * 0.33) return "bloodied";
    if (hpCur <= hpMax * 0.66) return "low";
    return "";
  }

  // ─── Reference matching ─────────────────────────────────────────────
  function npcBaseName(name) {
    return String(name || "")
      .replace(/\s*\[[A-Za-z0-9]+\]\s*$/, "")
      .replace(/\s+\d+\s*$/, "")
      .trim();
  }
  function pcBaseName(name) {
    return String(name || "").replace(/\s*\([^)]*\)\s*$/, "").trim();
  }
  function blockBaseName(s) {
    return String(s || "").split(/\s+[—–-]\s+/)[0].split(/\s*\(/)[0].trim();
  }
  function findReferenceFor(c) {
    if (!c) return null;
    if (c.kind === "pc") {
      const base = pcBaseName(c.name);
      return (ENCOUNTER.pc_blocks || []).find(p => {
        const bn = blockBaseName(p.header || p.name || "");
        return bn === base || base.startsWith(bn) || bn.startsWith(base);
      }) || null;
    }
    const base = npcBaseName(c.name);
    return (ENCOUNTER.npc_blocks || []).find(b => {
      const bn = blockBaseName(b.title || b.name || "");
      return bn === base || base.startsWith(bn) || bn.startsWith(base);
    }) || null;
  }

  // ─── Parsers ────────────────────────────────────────────────────────
  function parseAbilities(text) {
    if (!text) return null;
    const out = {};
    const re = /(STR|DEX|CON|INT|WIS|CHA)\s+(\d+)\s*\(([+-]?\d+)\)/g;
    let m, found = false;
    while ((m = re.exec(text)) !== null) {
      out[m[1]] = { score: parseInt(m[2], 10), mod: parseInt(m[3], 10) };
      found = true;
    }
    return found ? out : null;
  }
  function parseTitleCaption(title) {
    // "Mama Mantis (Orchid Mantis, Spring) — Large Monstrosity (mantis), Unaligned"
    // -> { name: "Mama Mantis (Orchid Mantis, Spring)", caption: "Large Monstrosity (mantis), Unaligned" }
    const s = String(title || "");
    const m = s.split(/\s+—\s+|\s+–\s+/);
    if (m.length >= 2) return { name: m[0], caption: m.slice(1).join(" — ") };
    return { name: s, caption: "" };
  }
  function parseStatsLine(text) {
    if (!text) return {};
    const result = {};
    // Drop everything to keep the parts we want
    const parts = text.split(/\s*\|\s*/);
    parts.forEach(p => {
      const t = p.trim();
      let m;
      if ((m = t.match(/^AC\s+(\d+)(?:\s*\(([^)]+)\))?/i))) {
        result.ac = parseInt(m[1], 10);
        result.ac_note = m[2] || "";
      } else if ((m = t.match(/^HP\s+([^\s(]+)(?:\s*\(([^)]+)\))?/i))) {
        result.hp_text = m[1];
      } else if ((m = t.match(/^Speed\s+(.+)/i))) {
        result.speed = m[1].trim();
      } else if (/\b(STR|DEX|CON|INT|WIS|CHA)\s+\d+/.test(t)) {
        const ab = parseAbilities(t);
        if (ab) result.abilities = ab;
      }
    });
    return result;
  }
  function parseDefenses(text) {
    if (!text) return {};
    const out = {};
    text.split(/\s*\|\s*/).forEach(part => {
      const t = part.trim();
      let m;
      if ((m = t.match(/^Saves?:\s*(.+)/i)))                       out.saves = m[1];
      else if ((m = t.match(/^Skills?:\s*(.+)/i)))                 out.skills = m[1];
      else if ((m = t.match(/^Senses?:\s*(.+)/i))) {
        out.senses = m[1];
        const pp = m[1].match(/passive\s+Perception\s+(\d+)/i);
        if (pp) out.passivePerception = parseInt(pp[1], 10);
      }
      else if ((m = t.match(/^(?:Damage\s+)?Resistances?:\s*(.+)/i))) out.resistances = m[1];
      else if ((m = t.match(/^(?:Damage\s+)?Immunit(?:y|ies):\s*(.+)/i))) out.damageImmunities = m[1];
      else if ((m = t.match(/^Immune\s*\(damage\):\s*(.+)/i)))     out.damageImmunities = m[1];
      else if ((m = t.match(/^Condition\s+Immunit(?:y|ies):\s*(.+)/i))) out.conditionImmunities = m[1];
      else if ((m = t.match(/^Immune\s*\(conditions\):\s*(.+)/i))) out.conditionImmunities = m[1];
      else if ((m = t.match(/^Vulnerab(?:le|ility|ilities):\s*(.+)/i))) out.vulnerabilities = m[1];
      else if ((m = t.match(/^Languages?:\s*(.+)/i)))              out.languages = m[1];
      else if (/^(CR|PB)\s/i.test(t)) { /* drop CR/XP/PB per spec */ }
      else if (t) {
        out._extras = (out._extras || []).concat(t);
      }
    });
    return out;
  }
  function parsePcHeader(text) {
    // "Tabatha Starr (Heather) — Ranger 6 (Gloomstalker) | Lone Star Tick | AC 15 | HP 42 | Speed 30 | Passive Perception 15 | Init +6"
    if (!text) return {};
    const out = {};
    const parts = text.split(/\s*\|\s*/);
    const firstSplit = parts[0].split(/\s+—\s+|\s+–\s+/);
    out.name = (firstSplit[0] || "").trim();
    out.classLine = (firstSplit.slice(1).join(" — ") || "").trim();
    parts.slice(1).forEach(p => {
      const t = p.trim();
      let m;
      if ((m = t.match(/^AC\s+(\d+)(?:\s*\(([^)]+)\))?/i))) {
        out.ac = parseInt(m[1], 10);
        out.ac_note = m[2] || "";
      } else if ((m = t.match(/^HP\s+(\d+)/i))) {
        out.hp = parseInt(m[1], 10);
      } else if ((m = t.match(/^Speed\s+(.+)/i))) {
        out.speed = m[1].trim();
      } else if ((m = t.match(/^Passive\s+Perception\s+(\d+)/i))) {
        out.passivePerception = parseInt(m[1], 10);
      } else if ((m = t.match(/^Init\s+([+-]?\d+)/i))) {
        out.init = m[1];
      } else if (t && !out.species) {
        out.species = t;
      }
    });
    return out;
  }
  function parseAttacksList(text) {
    if (!text) return [];
    // Split on " | " or "  |  " (double-pipe spacing in the source)
    return text.split(/\s+\|\s+/).map(s => s.trim()).filter(Boolean);
  }
  function parseSpellsByLevel(text) {
    if (!text) return [];
    // Split on patterns like "1st:", "2nd (4 slots):", "Cantrips:" etc.
    const re = /(Cantrips|\d+(?:st|nd|rd|th))\s*(?:\(([^)]+)\))?\s*:\s*([^]*?)(?=(?:Cantrips|\d+(?:st|nd|rd|th))\s*(?:\([^)]*\))?\s*:|$)/g;
    const out = [];
    let m;
    while ((m = re.exec(text)) !== null) {
      out.push({
        level: m[1],
        meta: (m[2] || "").trim(),
        list: m[3].trim().replace(/[,.\s]+$/, "")
      });
    }
    if (!out.length) out.push({ level: "All", meta: "", list: text });
    return out;
  }
  function parseFeaturesList(text) {
    if (!text) return [];
    // Heuristic: split on " . " or ". " followed by capitalized word that ends with ':' soon after, or " | "
    // Easier: split by " | " if present, else split by ". " when followed by uppercase.
    if (text.indexOf("|") >= 0) return text.split(/\s*\|\s*/).map(s => s.trim()).filter(Boolean);
    // Otherwise, split by sentence-ish boundary at "Capitalized Feature Name:"
    // We just look for patterns "Word: " or "Word feat:" / "Word (feat):" preceded by ". "
    // Fallback: just return the whole thing as one item.
    const sentences = text.split(/(?<=\.)\s+(?=[A-Z][^.]{0,80}?:)/);
    return sentences.map(s => s.trim()).filter(Boolean);
  }
  function parseRechargeFromName(name) {
    if (!name) return null;
    const m = String(name).match(/\(Recharge\s+([\d–\-]+)\)/i);
    if (!m) return null;
    return { raw: m[0], rangeText: m[1] };
  }

  // ─── Recharge index for active combatant ────────────────────────────
  function collectRechargeActions(block) {
    if (!block || !Array.isArray(block.sections)) return [];
    const out = [];
    block.sections.forEach(s => {
      (s.entries || []).forEach(e => {
        const r = parseRechargeFromName(e.name);
        if (r) out.push({ actionName: e.name.replace(/\s*\(Recharge[^)]+\)\s*$/i, "").trim(), rangeText: r.rangeText, raw: r.raw });
      });
    });
    return out;
  }

  // ─── Rendering ──────────────────────────────────────────────────────
  function renderTopbar() {
    const nm = ENCOUNTER.name || "Encounter";
    document.getElementById("encounter-name").innerHTML = esc(nm);
    document.title = "Encounter — " + nm;
    document.getElementById("round-num").textContent = state.round;
  }

  function renderTracker() {
    const root = document.getElementById("tracker-rows");
    root.innerHTML = "";
    const list = sortedCombatants();

    list.forEach(c => {
      const row = document.createElement("div");
      row.className = "row " + (c.kind || "npc");
      row.dataset.id = c.id;
      if (c.id === state.activeId) row.classList.add("active");
      else if (state.actedThisRound.indexOf(c.id) >= 0) row.classList.add("acted");
      if (c.id === state.focusOverride && c.id !== state.activeId) row.classList.add("focused");
      if (c.hp_current <= 0) row.classList.add("dead");

      // Init
      const init = document.createElement("input");
      init.type = "text";
      init.inputMode = "numeric";
      init.pattern = "-?[0-9]*";
      init.maxLength = 3;
      init.className = "init" + (c.initiative == null ? " empty" : "");
      const initStr = c.initiative == null ? "" : String(c.initiative);
      init.value = initStr;
      init.setAttribute("value", initStr); // serialize for screenshot/print
      init.placeholder = "—";
      init.setAttribute("aria-label", "Initiative for " + c.name);
      ["click", "touchstart", "mousedown"].forEach(ev => init.addEventListener(ev, e => e.stopPropagation()));
      init.addEventListener("focus", () => init.select());
      init.addEventListener("blur", () => commitInit(c, init));
      init.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); init.blur(); } });
      row.appendChild(init);

      // Info
      const info = document.createElement("div");
      info.className = "info";
      const groupTag = c.group ? ' <span class="group-tag">GRP ' + esc(c.group) + '</span>' : '';
      const initMod = c.init_mod ? '<span class="init-mod">' + esc(c.init_mod) + '</span>' : '';
      info.innerHTML =
        '<div class="name">' + esc(c.name) + groupTag + '</div>' +
        '<div class="meta">' +
          '<span class="ac">' + esc(c.ac) + '</span>' +
          (c.speed ? '<span class="speed">' + esc(c.speed) + '</span>' : '') +
          initMod +
        '</div>';
      row.appendChild(info);

      // Pills column (separate grid track — fills empty row space to the right of info)
      const pillsCol = document.createElement("div");
      pillsCol.className = "row-pills";
      pillsCol.innerHTML = c.conditions.map(cn => '<span class="pill">' + esc(cn) + '</span>').join('');
      row.appendChild(pillsCol);

      // HP column
      const hpc = hpClass(c.hp_current, c.hp_max);
      const pct = Math.max(0, Math.min(100, (c.hp_current / Math.max(1, c.hp_max)) * 100));
      const hpCol = document.createElement("div");
      hpCol.className = "hp-col";
      hpCol.innerHTML =
        '<div class="hp-display ' + hpc + '">' +
          esc(c.hp_current) + '<span class="sep">/</span><span class="max">' + esc(c.hp_max) + '</span>' +
        '</div>' +
        '<div class="hp-bar"><div class="hp-bar-fill ' + hpc + '" style="width:' + pct + '%"></div></div>';
      row.appendChild(hpCol);

      // Controls
      const ctrl = document.createElement("div");
      ctrl.className = "controls";
      ctrl.innerHTML =
        '<input type="number" class="amt" inputmode="numeric" placeholder="—" min="0">' +
        '<button class="dmg" title="Apply damage">−</button>' +
        '<button class="heal" title="Apply healing">+</button>' +
        '<button class="cond' + (c.conditions.length ? ' has' : '') + (state.condPanelOpen === c.id ? ' open' : '') + '" title="Conditions">' +
          'Cond' +
        '</button>';
      const amt = ctrl.querySelector(".amt");
      ["click","touchstart","focus"].forEach(ev => amt.addEventListener(ev, e => e.stopPropagation()));
      ctrl.querySelector(".dmg").addEventListener("click", e => {
        e.stopPropagation();
        const n = parseInt(amt.value, 10);
        if (!Number.isFinite(n) || n < 0) return;
        c.hp_current = Math.max(0, c.hp_current - n);
        amt.value = ""; saveState(); renderTracker(); renderActiveRef();
      });
      ctrl.querySelector(".heal").addEventListener("click", e => {
        e.stopPropagation();
        const n = parseInt(amt.value, 10);
        if (!Number.isFinite(n) || n < 0) return;
        c.hp_current = Math.min(c.hp_max, c.hp_current + n);
        amt.value = ""; saveState(); renderTracker(); renderActiveRef();
      });
      const condBtn = ctrl.querySelector(".cond");
      condBtn.addEventListener("click", e => {
        e.stopPropagation();
        state.condPanelOpen = state.condPanelOpen === c.id ? null : c.id;
        saveState(); renderTracker();
      });
      row.appendChild(ctrl);

      // Conditions panel (inline expander)
      if (state.condPanelOpen === c.id) {
        const condPanel = document.createElement("div");
        condPanel.className = "cond-panel open";
        condPanel.innerHTML = '<div class="pills">' +
          CONDITIONS.map(cn => {
            const on = c.conditions.indexOf(cn) >= 0;
            return '<button class="pill-tog ' + (on ? 'on' : '') + '" data-c="' + esc(cn) + '">' + esc(cn) + '</button>';
          }).join('') + '</div>';
        condPanel.addEventListener("click", e => e.stopPropagation());
        condPanel.querySelectorAll(".pill-tog").forEach(btn => {
          btn.addEventListener("click", () => {
            const cn = btn.dataset.c;
            const idx = c.conditions.indexOf(cn);
            if (idx >= 0) c.conditions.splice(idx, 1); else c.conditions.push(cn);
            saveState(); renderTracker(); renderActiveRef();
          });
        });
        row.appendChild(condPanel);
      }

      root.appendChild(row);
    });
    document.getElementById("round-num").textContent = state.round;
    renderMuster();
  }

  function renderMuster() {
    const root = document.getElementById("muster");
    if (!root) return;
    if (!ROSTER.length) { root.innerHTML = ""; return; }
    root.innerHTML = '<span class="muster-label">Muster</span>' + ROSTER.map((e, i) => {
      const n = typeCount(state.combatants, e);
      return '<span class="muster-item' + (n ? '' : ' none') + '" data-i="' + i + '">' +
        '<button class="mus-minus" ' + (n ? '' : 'disabled') +
          ' aria-label="Remove one ' + esc(e.name) + '" title="Remove one ' + esc(e.name) + '">−</button>' +
        '<span class="mus-name">' + esc(e.name) + '</span>' +
        '<span class="mus-count">' + n + '</span>' +
        '<button class="mus-plus" aria-label="Add one ' + esc(e.name) +
          '" title="Add one ' + esc(e.name) + ' (rolls HP, initiative left blank)">+</button>' +
      '</span>';
    }).join('');
    root.querySelectorAll(".muster-item").forEach(el => {
      const entry = ROSTER[parseInt(el.dataset.i, 10)];
      el.querySelector(".mus-plus").addEventListener("click", ev => {
        ev.stopPropagation();
        spawnOne(state.combatants, entry);
        saveState(); renderTracker(); renderActiveRef();
      });
      el.querySelector(".mus-minus").addEventListener("click", ev => {
        ev.stopPropagation();
        despawnOne(entry);
        saveState(); renderTracker(); renderActiveRef();
      });
    });
  }

  function commitInit(c, inputEl) {
    const t = inputEl.value.trim();
    let newVal;
    if (t === "") newVal = null;
    else {
      const n = parseInt(t, 10);
      if (Number.isNaN(n)) { inputEl.value = c.initiative == null ? "" : String(c.initiative); return; }
      newVal = n;
    }
    if (newVal === c.initiative) return;
    c.initiative = newVal;
    saveState(); renderTracker();
  }

  // ─── Active reference panel ─────────────────────────────────────────
  function renderActiveRef() {
    const root = document.getElementById("active-ref");
    const focusedId = state.focusOverride || state.activeId;

    if (!focusedId) {
      root.innerHTML = '<div class="empty"><strong>No active turn</strong>Press <b>Next ▶</b> to begin combat, or tap any row to pin its reference here.</div>';
      return;
    }
    const c = state.combatants.find(x => x.id === focusedId);
    if (!c) { root.innerHTML = ""; return; }
    const block = findReferenceFor(c);
    if (!block) {
      root.innerHTML = '<div class="empty"><strong>' + esc(c.name) + '</strong>No reference block matched.</div>';
      return;
    }

    if (c.kind === "pc") renderPcRef(root, c, block);
    else renderNpcRef(root, c, block);
  }

  // ── NPC active reference
  function renderNpcRef(root, c, block) {
    const tc = parseTitleCaption(block.title);
    const stats = parseStatsLine(block.stats);
    const defenses = parseDefenses(block.defenses);
    const abilities = stats.abilities || parseAbilities(block.stats);

    const hpc = hpClass(c.hp_current, c.hp_max);
    const isPinned = state.focusOverride && state.focusOverride !== state.activeId;
    const isCurrent = c.id === state.activeId;

    // Section index
    const sections = block.sections || [];
    const tacticsSection = sections.find(s => /tactics/i.test(s.label || ""));
    const actionsSections = sections.filter(s => !/tactics/i.test(s.label || ""));
    // Count only NON-trait entries for the Actions tab badge (traits live on the Stats tab).
    const visibleActionCount = actionsSections.reduce((n, s) =>
      n + (/trait/i.test(s.label || "") ? 0 : (s.entries || []).length), 0);

    // Recharge actions for this NPC
    const rechargers = collectRechargeActions(block);
    const spent = state.rechargeSpent[c.id] || {};

    // Available tabs
    const tabs = [];
    tabs.push({ id: "stats", label: "Stats" });
    if (visibleActionCount) tabs.push({ id: "actions", label: "Actions", badge: visibleActionCount });
    if (tacticsSection) tabs.push({ id: "tactics", label: "Tactics" });

    // Active tab fallback
    let activeTab = state.activeTab;
    if (!activeTab || !tabs.find(t => t.id === activeTab)) {
      activeTab = (isCurrent && visibleActionCount) ? "actions" : "stats";
    }

    // Header HTML
    const eyebrow =
      '<div class="ar-eyebrow">' +
        '<span class="kind">NPC' + (c.group ? ' · Group ' + esc(c.group) : '') + '</span>' +
        '<span class="status ' + (isPinned ? 'pinned' : (isCurrent ? 'current' : '')) + '">' +
          (isPinned ? 'Pinned · tap row to unpin' : (isCurrent ? "Active turn" : '')) +
        '</span>' +
      '</div>';

    const headerHtml =
      '<div class="ar-head">' +
        eyebrow +
        '<div class="ar-head-main">' +
          '<h2>' + esc(c.name) + '</h2>' +
          (tc.caption ? '<div class="ar-caption">' + esc(tc.caption) + '</div>' : '') +
        '</div>' +
        renderStatStrip(c, hpc, stats, defenses) +
        (rechargers.length ? '<div class="ar-recharge-row">' + renderRechargeStrip(rechargers, spent, c.id) + '</div>' : '') +
      '</div>';

    // Tabs HTML
    const tabsHtml = '<div class="ar-tabs">' + tabs.map(t =>
      '<button class="ar-tab' + (t.id === activeTab ? ' active' : '') + '" data-tab="' + t.id + '">' +
        esc(t.label) + (t.badge ? '<span class="badge">' + t.badge + '</span>' : '') +
      '</button>'
    ).join('') + '</div>';

    // Body content per tab
    let body = "";
    if (activeTab === "stats") body = renderNpcStatsTab(c, abilities, defenses, stats, block);
    else if (activeTab === "actions") body = renderNpcActionsTab(actionsSections, spent);
    else if (activeTab === "tactics") body = renderNpcTacticsTab(tacticsSection);

    root.innerHTML = headerHtml + tabsHtml + '<div class="ar-body">' + body + '</div>';

    // Wire tab buttons
    root.querySelectorAll(".ar-tab").forEach(btn => {
      btn.addEventListener("click", () => {
        state.activeTab = btn.dataset.tab;
        saveState();
        renderActiveRef();
      });
    });
    // Wire recharge chips
    root.querySelectorAll(".recharge-chip").forEach(chip => {
      chip.addEventListener("click", () => {
        const an = chip.dataset.action;
        const map = state.rechargeSpent[c.id] || (state.rechargeSpent[c.id] = {});
        map[an] = !map[an];
        saveState();
        renderActiveRef();
      });
    });
  }
  function countActionEntries(sections) {
    return sections.reduce((n, s) => n + (s.entries || []).length, 0);
  }

  // ── PC active reference
  function renderPcRef(root, c, block) {
    const hdr = parsePcHeader(block.header);
    const abilities = parseAbilities(block.abilities);
    const hpc = hpClass(c.hp_current, c.hp_max);
    const isPinned = state.focusOverride && state.focusOverride !== state.activeId;
    const isCurrent = c.id === state.activeId;

    const attacksList = parseAttacksList(block.attacks);
    const spellsLevels = parseSpellsByLevel(block.spells);
    const featuresList = parseFeaturesList(block.features);

    const tabs = [{ id: "stats", label: "Stats" }];
    if (attacksList.length) tabs.push({ id: "attacks", label: "Attacks", badge: attacksList.length });
    if (block.spells) tabs.push({ id: "spells", label: "Spells" });
    if (block.features) tabs.push({ id: "features", label: "Features" });

    let activeTab = state.activeTab;
    if (!activeTab || !tabs.find(t => t.id === activeTab)) activeTab = "stats";

    // Build a synthetic "stats" line so renderStatStrip works
    const fauxStats = { speed: hdr.speed, ac_note: hdr.ac_note };
    const fauxDefenses = { passivePerception: hdr.passivePerception };

    const headerHtml =
      '<div class="ar-head">' +
        '<div class="ar-eyebrow">' +
          '<span class="kind">PC' + (hdr.species ? ' · ' + esc(hdr.species) : '') + '</span>' +
          '<span class="status ' + (isPinned ? 'pinned' : (isCurrent ? 'current' : '')) + '">' +
            (isPinned ? 'Pinned · tap row to unpin' : (isCurrent ? "Active turn" : '')) +
          '</span>' +
        '</div>' +
        '<div class="ar-head-main">' +
          '<h2>' + esc(hdr.name || c.name) + '</h2>' +
          (hdr.classLine ? '<div class="ar-caption">' + esc(hdr.classLine) + '</div>' : '') +
        '</div>' +
        renderPcStatStrip(c, hpc, hdr, block) +
      '</div>';

    const tabsHtml = '<div class="ar-tabs">' + tabs.map(t =>
      '<button class="ar-tab' + (t.id === activeTab ? ' active' : '') + '" data-tab="' + t.id + '">' +
        esc(t.label) + (t.badge ? '<span class="badge">' + t.badge + '</span>' : '') +
      '</button>'
    ).join('') + '</div>';

    let body = "";
    if (activeTab === "stats") body = renderPcStatsTab(c, abilities, block);
    else if (activeTab === "attacks") body = renderPcAttacksTab(attacksList);
    else if (activeTab === "spells") body = renderPcSpellsTab(spellsLevels);
    else if (activeTab === "features") body = renderPcFeaturesTab(featuresList);

    root.innerHTML = headerHtml + tabsHtml + '<div class="ar-body">' + body + '</div>';

    root.querySelectorAll(".ar-tab").forEach(btn => {
      btn.addEventListener("click", () => {
        state.activeTab = btn.dataset.tab;
        saveState();
        renderActiveRef();
      });
    });
  }

  // ── Stat strip renderers (header bottom)
  function renderStatStrip(c, hpc, stats, defenses) {
    // For NPCs: surface only info NOT shown in the initiative row (senses, passive Perception).
    // AC / HP / Speed already live on the row.
    const sensesText = defenses.senses || "";
    const ppMatch = sensesText.match(/passive\s+Perception\s+(\d+)/i);
    const pp = ppMatch ? parseInt(ppMatch[1], 10) : (defenses.passivePerception || null);
    // Strip pp from the senses string for the row to avoid double-display
    const sensesClean = sensesText.replace(/[,;]?\s*passive\s+Perception\s+\d+\.?/i, "").trim().replace(/,\s*$/, "");

    const acNoteRow = stats.ac_note ? '<dt>AC Type</dt><dd>' + esc(stats.ac_note) + '</dd>' : '';
    const senseRow = sensesClean ? '<dt>Senses</dt><dd>' + esc(sensesClean) + '</dd>' : '';
    const ppRow = (pp != null) ? '<dt>Pass. Perc.</dt><dd class="passive"><span class="pp-val">' + pp + '</span></dd>' : '';

    if (!acNoteRow && !senseRow && !ppRow) return "";
    return '<dl class="ar-supp">' + acNoteRow + senseRow + ppRow + '</dl>';
  }
  function renderPcStatStrip(c, hpc, hdr, block) {
    // For PCs: surface info NOT in the row (passive Perception, save proficiencies, spell DC / attack).
    // AC / HP / Speed / Init already on the row.
    const rows = [];
    if (hdr.passivePerception != null) {
      rows.push('<dt>Pass. Perc.</dt><dd class="passive"><span class="pp-val">' + hdr.passivePerception + '</span></dd>');
    }
    if (block && block.saves) {
      // Compress "STR +5 (prof), DEX +7 (prof). Others use ability mod." to just the prof list.
      const profs = (block.saves.match(/([A-Z]{3})\s+([+-]?\d+)\s*\(prof\)/g) || []).join(", ");
      const display = profs || block.saves;
      rows.push('<dt>Saves</dt><dd>' + numClass(display) + '</dd>');
    }
    // Detect spell DC / attack bonus from spells block, if present
    if (block && block.spells) {
      const m = block.spells.match(/(?:save\s*DC|DC)\s*(\d+)/i);
      const a = block.spells.match(/(?:spell\s*attack|atk)\s*([+-]?\d+)/i);
      if (m || a) {
        const parts = [];
        if (m) parts.push('DC <span class="num">' + esc(m[1]) + '</span>');
        if (a) parts.push('atk <span class="num">' + esc(a[1]) + '</span>');
        rows.push('<dt>Spellcasting</dt><dd>' + parts.join(' · ') + '</dd>');
      }
    }
    if (!rows.length) return "";
    return '<dl class="ar-supp">' + rows.join("") + '</dl>';
  }

  // ── Recharge strip
  function renderRechargeStrip(rechargers, spent, cid) {
    return '<div class="ar-recharge">' + rechargers.map(r => {
      const isSpent = !!spent[r.actionName];
      return '<button class="recharge-chip ' + (isSpent ? 'spent' : '') + '" data-action="' + esc(r.actionName) + '">' +
        esc(r.actionName) + '<span class="die">' + esc(r.rangeText) + '</span>' +
      '</button>';
    }).join('') + '</div>';
  }

  // ── NPC stats tab
  function renderNpcStatsTab(c, abilities, defenses, stats, block) {
    let html = "";
    if (abilities) html += renderAbilityTable(abilities);

    const lines = [];
    if (defenses.saves)               lines.push(["Saves", defenses.saves]);
    if (defenses.skills)              lines.push(["Skills", defenses.skills]);
    // Senses already shown in the header strip — don't repeat here.
    if (defenses.languages)           lines.push(["Languages", defenses.languages]);
    if (defenses.vulnerabilities)     lines.push(["Vulnerable", defenses.vulnerabilities]);
    if (defenses.resistances)         lines.push(["Resists", defenses.resistances]);
    if (defenses.damageImmunities)    lines.push(["Dmg Immune", defenses.damageImmunities]);
    if (defenses.conditionImmunities) lines.push(["Cond Immune", defenses.conditionImmunities]);
    if (defenses._extras)             defenses._extras.forEach(e => lines.push(["Other", e]));

    if (lines.length) {
      html += '<div class="ar-section">' +
        '<div class="ar-section-head">Defenses</div>' +
        '<dl style="margin:0">' +
        lines.map(([k, v]) => '<div class="kv-line"><dt>' + esc(k) + '</dt><dd>' + numClass(v) + '</dd></div>').join('') +
        '</dl>' +
      '</div>';
    }

    // Add TRAITS section to stats tab (always-on passive abilities)
    const traits = (block.sections || []).find(s => /trait/i.test(s.label || ""));
    if (traits && (traits.entries || []).length) {
      html += '<div class="ar-section"><div class="ar-section-head">Traits</div>';
      traits.entries.forEach(e => {
        html += '<div class="action-entry">' +
          '<div class="entry-name">' + esc(e.name) + '</div>' +
          '<div class="entry-text">' + numClass(e.text) + '</div>' +
        '</div>';
      });
      html += '</div>';
    }

    if (c.notes) html += '<div class="npc-notes">' + esc(c.notes) + '</div>';
    return html;
  }
  function renderAbilityTable(abilities) {
    let html = '<div class="ability-table">';
    ABILITIES.forEach(ab => {
      const v = abilities[ab];
      if (!v) {
        html += '<div class="ability-cell">' +
          '<div class="ab-name">' + ab + '</div>' +
          '<div class="ab-mod">—</div>' +
        '</div>';
      } else {
        const sign = v.mod >= 0 ? "+" : "";
        const cls = v.mod > 0 ? "pos" : v.mod < 0 ? "neg" : "";
        html += '<div class="ability-cell">' +
          '<div class="ab-name">' + ab + '</div>' +
          '<div class="ab-mod ' + cls + '">' + sign + v.mod + '</div>' +
          '<div class="ab-score">' + v.score + '</div>' +
        '</div>';
      }
    });
    return html + '</div>';
  }

  // ── Parse a single attack entry's text into structured stats
  // Recognizes patterns like:
  //   "Melee Weapon Attack: +7 to hit, reach 10 ft., one target. Hit: 13 (2d8+4) slashing. On a crit: ..."
  //   "Ranged Spell Attack: +5 to hit, range 60 ft. Hit: 9 (2d6+2) fire damage."
  //   "DC 15 STR save or ... "
  // Returns { type, toHit, range, target, hit, extra } or null if it doesn't look like an attack.
  function parseAttackEntry(text) {
    if (!text) return null;
    const s = String(text);
    // Type prefix
    const typeMatch = s.match(/^(Melee|Ranged)\s+(Weapon|Spell)\s+Attack:/i);
    const isAttack = !!typeMatch;
    // To-hit
    const hitM = s.match(/([+-]\d+)\s+to\s+hit/i);
    // Reach or range
    const reachM = s.match(/reach\s+(\d+\s*ft\.?(?:\s*\/\s*\d+\s*ft\.?)?)/i);
    const rangeM = s.match(/range\s+(\d+\s*(?:\/\s*\d+\s*)?ft\.?)/i);
    // Hit damage (first occurrence after "Hit:")
    const hitDmgM = s.match(/Hit:\s+(\d+\s*\([^)]+\)\s+[a-z]+(?:\s+damage)?)/i);
    // Save-only attacks (DC X SAVE ...) when no to-hit
    const saveM = !hitM ? s.match(/DC\s+(\d+)\s+([A-Z]{3})\s+save/i) : null;

    if (!isAttack && !hitM && !saveM) return null;

    // Compact type label — drop the verbose suffix
    let type = "";
    if (typeMatch) {
      const which = typeMatch[1].toLowerCase();  // melee | ranged
      const kind = typeMatch[2].toLowerCase();   // weapon | spell
      type = (kind === "spell") ? "Spell" : (which === "melee" ? "Melee" : "Ranged");
    } else if (saveM) {
      type = "Save";
    } else {
      type = "Attack";
    }

    const out = {
      type: type,
      toHit: hitM ? hitM[1] : (saveM ? "DC " + saveM[1] + " " + saveM[2] : ""),
      range: reachM ? "reach " + reachM[1] : (rangeM ? "range " + rangeM[1] : ""),
      hit: hitDmgM ? hitDmgM[1].trim() : "",
      extra: ""
    };
    // Extra: everything left over after stripping the standardized bits.
    let extra = s;
    if (typeMatch) extra = extra.replace(typeMatch[0], "");
    if (hitM) extra = extra.replace(/([+-]\d+)\s+to\s+hit,?\s*/i, "");
    if (reachM) extra = extra.replace(/reach\s+\d+\s*ft\.?(?:\s*\/\s*\d+\s*ft\.?)?,?\s*/i, "");
    if (rangeM) extra = extra.replace(/range\s+\d+\s*(?:\/\s*\d+\s*)?ft\.?,?\s*/i, "");
    extra = extra.trimStart();
    // Strip target phrase: "one creature", "one Medium-or-smaller target", "one target you can see", etc.
    extra = extra.replace(/^one\s+[^.]*?(?:target|creature|object|enemy)[^.]*\.\s*/i, "");
    if (hitDmgM) extra = extra.replace(/Hit:\s+\d+\s*\([^)]+\)\s+[a-z]+(?:\s+damage)?\.?\s*/i, "");
    extra = extra.replace(/^[\s.,:+]+/, "").trim();
    out.extra = extra;
    return out;
  }

  // ── NPC actions tab — table-style attack hierarchy
  function renderNpcActionsTab(sections, spent) {
    let html = "";
    sections.forEach(s => {
      if (/trait/i.test(s.label || "")) return; // already on stats tab
      if (!(s.entries && s.entries.length)) return;
      html += '<div class="action-group"><div class="ar-section-head">' + esc(s.label) + '</div>';
      s.entries.forEach(e => {
        const r = parseRechargeFromName(e.name);
        const cleanName = r ? e.name.replace(/\s*\(Recharge[^)]+\)\s*$/i, "").trim() : e.name;
        const isSpent = r && !!spent[cleanName];
        const parsed = parseAttackEntry(e.text);

        if (parsed) {
          const noStats = !parsed.toHit && !parsed.range && !parsed.hit;
          html += '<div class="attack-card' +
            (r ? ' recharge' : '') +
            (isSpent ? ' spent' : '') +
            (noStats ? ' no-stats' : '') + '">';
          html += '<div class="ac-head">' +
            '<span class="ac-name">' + esc(cleanName) + '</span>' +
            '<span class="ac-meta">' +
              '<span class="ac-type">' + esc(parsed.type) + '</span>' +
              (r ? '<span class="ac-recharge">Rch ' + esc(r.rangeText) + '</span>' : '') +
            '</span>' +
          '</div>';
          if (!noStats) {
            html += '<div class="ac-stats">';
            if (parsed.toHit) {
              const isSave = /^DC/i.test(parsed.toHit);
              html += '<div class="ac-stat ' + (isSave ? 'save' : 'tohit') + '">' +
                '<span class="lab">' + (isSave ? 'Save' : 'To Hit') + '</span>' +
                '<span class="val">' + esc(parsed.toHit) + '</span>' +
              '</div>';
            }
            if (parsed.range) {
              html += '<div class="ac-stat range">' +
                '<span class="lab">Range</span>' +
                '<span class="val">' + esc(parsed.range) + '</span>' +
              '</div>';
            }
            if (parsed.hit) {
              html += '<div class="ac-stat hit">' +
                '<span class="lab">On Hit</span>' +
                '<span class="val">' + numClass(parsed.hit) + '</span>' +
              '</div>';
            }
            html += '</div>';
          }
          if (parsed.extra) {
            html += '<div class="ac-extra">' + numClass(parsed.extra) + '</div>';
          }
          html += '</div>';
        } else {
          // Non-attack entry (Multiattack, area effect, narrative). Keep the original action-entry look.
          html += '<div class="action-entry' + (r ? ' recharge' : '') + (isSpent ? ' spent' : '') + '">' +
            '<div class="entry-name">' + esc(cleanName) +
              (r ? '<span class="recharge-tag">RECHARGE ' + esc(r.rangeText) + '</span>' : '') +
            '</div>' +
            '<div class="entry-text">' + numClass(e.text) + '</div>' +
          '</div>';
        }
      });
      html += '</div>';
    });
    return html;
  }

  // ── NPC tactics tab
  function renderNpcTacticsTab(section) {
    if (!section) return '<div class="empty">No tactics notes.</div>';
    let html = "";
    (section.entries || []).forEach(e => {
      html += '<div class="tactics-entry">' +
        '<div class="tac-name">' + esc(e.name) + '</div>' +
        '<div class="tac-text">' + esc(e.text) + '</div>' +
      '</div>';
    });
    return html;
  }

  // ── PC stats tab
  function renderPcStatsTab(c, abilities, block) {
    let html = "";
    if (abilities) html += renderAbilityTable(abilities);
    // Saves already shown in the header — don't duplicate. If we want a fuller saves view
    // (with the "others use ability mod" caveat) it lives in Features/Notes territory.
    if (c.notes) html += '<div class="pc-notes">' + esc(c.notes) + '</div>';
    return html;
  }

  // ── Parse a PC attack line into structured stats.
  // Formats vary, but the common shape is:
  //   "Longbow +9, 1d8+4 piercing (150/600) [Archery]"
  //   "Dagger (melee) +7, 1d4+4 piercing."
  //   "Eldritch Blast +9, 2× 1d10 force (120 ft.)"
  // Non-attack rows ("EXTRA ATTACK ...", "Spell save DC 13") return null.
  function parsePcAttackLine(text) {
    if (!text) return null;
    const s = String(text).trim();
    // Find the to-hit: a "+N" or "-N" near the start (after the name).
    // The name can include spaces, parentheses ("Dagger (melee)"), hyphens, apostrophes.
    const hitM = s.match(/^([^+\-,]+?(?:\([^)]*\))?\s*)([+-]\d+)\s*(?:to\s+hit)?[,.\s]/i);
    if (!hitM) return null;
    const name = hitM[1].trim();
    const toHit = hitM[2];
    let rest = s.slice(hitM[0].length).trim();
    // Damage: looks like "1d8+4 piercing" or "2d6 fire" — capture "XdY[+Z]( damage type)?"
    let damage = "";
    const dmgM = rest.match(/^(\d*d\d+(?:[+-]\d+)?(?:\s*[a-zA-Z]+)?(?:\s+damage)?)/);
    if (dmgM) {
      damage = dmgM[1].trim();
      rest = rest.slice(dmgM[0].length).trim();
    }
    // Range/reach: "(150/600)", "(20/60)", or "reach 5 ft."
    let range = "";
    const rangeM = rest.match(/^\((\d+(?:\/\d+)?(?:\s*ft\.?)?)\)/);
    const reachM = !rangeM ? rest.match(/^reach\s+(\d+\s*ft\.?)/i) : null;
    if (rangeM) {
      range = rangeM[1].includes("ft") ? rangeM[1] : (rangeM[1] + " ft.");
      rest = rest.slice(rangeM[0].length).trim();
    } else if (reachM) {
      range = "reach " + reachM[1];
      rest = rest.slice(reachM[0].length).trim();
    }
    // Tag: "[Archery]" etc.
    let tag = "";
    const tagM = rest.match(/^\[([^\]]+)\]/);
    if (tagM) {
      tag = tagM[1].trim();
      rest = rest.slice(tagM[0].length).trim();
    }
    // Leftover punctuation / extra notes
    let extra = rest.replace(/^[,.\s]+/, "").trim();
    if (tag && !extra) extra = "";  // tag handled separately
    return { name, toHit, range, damage, tag, extra };
  }

  // ── PC attacks tab — attack cards matching the NPC layout
  function renderPcAttacksTab(attacks) {
    if (!attacks.length) return '<div class="empty">No attacks listed.</div>';
    let html = "";
    attacks.forEach(att => {
      const p = parsePcAttackLine(att);
      if (p) {
        const noStats = !p.toHit && !p.range && !p.damage;
        html += '<div class="attack-card' + (noStats ? ' no-stats' : '') + '">';
        html += '<div class="ac-head">' +
          '<span class="ac-name">' + esc(p.name) + '</span>' +
          (p.tag ? '<span class="ac-meta"><span class="ac-type">' + esc(p.tag) + '</span></span>' : '') +
        '</div>';
        if (!noStats) {
          html += '<div class="ac-stats">';
          if (p.toHit) {
            html += '<div class="ac-stat tohit">' +
              '<span class="lab">To Hit</span>' +
              '<span class="val">' + esc(p.toHit) + '</span>' +
            '</div>';
          }
          if (p.range) {
            html += '<div class="ac-stat range">' +
              '<span class="lab">Range</span>' +
              '<span class="val">' + esc(p.range) + '</span>' +
            '</div>';
          }
          if (p.damage) {
            html += '<div class="ac-stat hit">' +
              '<span class="lab">Damage</span>' +
              '<span class="val">' + numClass(p.damage) + '</span>' +
            '</div>';
          }
          html += '</div>';
        }
        if (p.extra) html += '<div class="ac-extra">' + numClass(p.extra) + '</div>';
        html += '</div>';
      } else {
        // Non-attack row: render as plain action-entry (EXTRA ATTACK, Spell save DC, etc.)
        const m = att.match(/^([^:.]+(?:\s\([^)]+\))?)[:.]\s*([^]*)$/);
        let name = att, rest = "";
        if (m) { name = m[1].trim(); rest = m[2].trim(); }
        html += '<div class="action-entry">' +
          '<div class="entry-name">' + esc(name) + '</div>' +
          (rest ? '<div class="entry-text">' + numClass(rest) + '</div>' : '') +
        '</div>';
      }
    });
    return html;
  }

  // ── PC spells tab
  function renderPcSpellsTab(levels) {
    if (!levels.length) return '<div class="empty">No spells.</div>';
    let html = "";
    levels.forEach(L => {
      const meta = L.meta ? ' <span class="head-meta">' + esc(L.meta) + '</span>' : '';
      html += '<div class="ar-section">' +
        '<div class="ar-section-head"><span>' + esc(L.level) + '</span>' + meta + '</div>' +
        '<div style="font-size:13px;line-height:1.55;color:var(--ink)">' + esc(L.list) + '</div>' +
      '</div>';
    });
    return html;
  }

  // ── PC features tab
  function renderPcFeaturesTab(features) {
    if (!features.length) return '<div class="empty">No features listed.</div>';
    let html = "";
    features.forEach(f => {
      // Try to extract "Name: rest" or "Name. rest"
      let name = f, rest = "";
      const m = f.match(/^([^:.]+(?:\s\([^)]+\))?)[:.]\s*([^]*)$/);
      if (m) { name = m[1].trim(); rest = m[2].trim(); }
      html += '<div class="action-entry">' +
        '<div class="entry-name">' + esc(name) + '</div>' +
        (rest ? '<div class="entry-text">' + numClass(rest) + '</div>' : '') +
      '</div>';
    });
    return html;
  }

  // ─── Encounter notes modal ──────────────────────────────────────────
  function renderNotesModal() {
    const body = document.getElementById("notes-modal-body");
    if (!body) return;
    const notes = ENCOUNTER.notes || [];
    if (!notes.length) {
      body.innerHTML = '<div class="empty" style="padding:24px;text-align:center;color:var(--ink-mute);font-family:var(--font-hand);font-style:italic">No encounter notes.</div>';
    } else {
      body.innerHTML = notes.map(n =>
        '<div class="notes-entry">' +
          '<div class="note-label">' + esc(n.label || "") + '</div>' +
          '<div class="note-text">' + esc(n.text || "") + '</div>' +
        '</div>'
      ).join("");
    }
    const notesBtn = document.getElementById("notes-btn");
    if (notesBtn) notesBtn.style.display = notes.length ? "" : "none";
  }
  function openNotesModal()  { document.getElementById("notes-modal").classList.add("open"); }
  function closeNotesModal() { document.getElementById("notes-modal").classList.remove("open"); }

  // ─── Turn order ─────────────────────────────────────────────────────
  function nextTurn() {
    const list = sortedCombatants().filter(c => c.initiative != null);
    if (!list.length) return;
    // mark current as acted before advancing
    if (state.activeId && state.actedThisRound.indexOf(state.activeId) < 0) {
      state.actedThisRound.push(state.activeId);
    }
    if (!state.activeId) {
      state.activeId = list[0].id;
    } else {
      const idx = list.findIndex(c => c.id === state.activeId);
      if (idx === -1 || idx === list.length - 1) {
        // end of round
        state.activeId = list[0].id;
        state.round += 1;
        state.actedThisRound = [];
      } else {
        state.activeId = list[idx + 1].id;
      }
    }
    state.focusOverride = null;
    state.activeTab = null; // reset to default tab on new turn
    saveState();
    renderTracker(); renderActiveRef();
    scrollActiveIntoView();
  }
  function prevTurn() {
    const list = sortedCombatants().filter(c => c.initiative != null);
    if (!list.length) return;
    if (!state.activeId) {
      state.activeId = list[list.length - 1].id;
    } else {
      const idx = list.findIndex(c => c.id === state.activeId);
      // un-mark previous from acted set
      if (idx > 0) {
        const prevId = list[idx - 1].id;
        const ai = state.actedThisRound.indexOf(prevId);
        if (ai >= 0) state.actedThisRound.splice(ai, 1);
        state.activeId = prevId;
      } else {
        state.activeId = list[list.length - 1].id;
        state.round = Math.max(1, state.round - 1);
        state.actedThisRound = list.slice(0, -1).map(c => c.id);
      }
    }
    state.focusOverride = null;
    state.activeTab = null;
    saveState();
    renderTracker(); renderActiveRef();
    scrollActiveIntoView();
  }
  function scrollActiveIntoView() {
    if (!state.activeId) return;
    const el = document.querySelector('.row[data-id="' + state.activeId + '"]');
    if (el && el.scrollIntoView) el.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }

  function resetEncounter() {
    if (!confirm("Reset encounter? This clears HP, conditions, round, active turn, and recharge tracking.")) return;
    state = defaultState();
    saveState();
    renderTracker(); renderActiveRef();
  }

  // ─── Row click handler (pin / unpin ref) ────────────────────────────
  function handleRowClick(ev) {
    if (ev.target.closest("input, button, .cond-panel, .hp-bar")) return;
    const rowEl = ev.target.closest(".row");
    if (!rowEl) return;
    const id = rowEl.dataset.id;
    const c = state.combatants.find(x => x.id === id);
    if (!c) return;
    if (state.focusOverride === c.id) {
      state.focusOverride = null;
    } else if (c.id === state.activeId) {
      state.focusOverride = null;
    } else {
      state.focusOverride = c.id;
      state.activeTab = null;
    }
    saveState();
    renderTracker(); renderActiveRef();
  }

  // ─── Tweaks panel ───────────────────────────────────────────────────
  function applyTweaks() {
    // Accent
    document.documentElement.classList.forEach(cls => {
      if (cls.startsWith("accent-")) document.documentElement.classList.remove(cls);
    });
    document.documentElement.classList.add("accent-" + tweaks.accent);
    // Density
    document.body.classList.remove("density-default", "density-compact", "density-roomy");
    document.body.classList.add("density-" + tweaks.density);
    // Font size
    document.documentElement.style.setProperty("--base-fs", tweaks.fontSize + "px");
  }
  function setupTweaks() {
    const accentRoot = document.getElementById("tw-accent");
    accentRoot.innerHTML = ACCENTS.map(a =>
      '<button class="tweak-swatch' + (tweaks.accent === a.id ? ' on' : '') + '" data-acc="' + a.id + '" style="background:' + a.color + '" title="' + a.id + '"></button>'
    ).join('');
    accentRoot.querySelectorAll(".tweak-swatch").forEach(b => {
      b.addEventListener("click", () => {
        tweaks.accent = b.dataset.acc;
        saveTweaks(); applyTweaks(); setupTweaks();
      });
    });

    const densityRoot = document.getElementById("tw-density");
    const densities = [["compact","Compact"],["default","Default"],["roomy","Roomy"]];
    densityRoot.innerHTML = densities.map(([k,l]) =>
      '<button class="' + (tweaks.density === k ? 'on' : '') + '" data-d="' + k + '">' + l + '</button>'
    ).join('');
    densityRoot.querySelectorAll("button").forEach(b => {
      b.addEventListener("click", () => {
        tweaks.density = b.dataset.d;
        saveTweaks(); applyTweaks(); setupTweaks();
      });
    });

    const fs = document.getElementById("tw-fs");
    const fsVal = document.getElementById("tw-fs-val");
    fs.value = tweaks.fontSize;
    fsVal.textContent = tweaks.fontSize + "px";
    fs.addEventListener("input", () => {
      tweaks.fontSize = parseInt(fs.value, 10);
      fsVal.textContent = tweaks.fontSize + "px";
      saveTweaks(); applyTweaks();
    });
  }
  function toggleTweaks() {
    document.getElementById("tweaks").classList.toggle("open");
  }

  // ─── Wire-up ────────────────────────────────────────────────────────
  try {
    applyTweaks();
    renderTopbar();
    renderNotesModal();
    renderTracker();
    renderActiveRef();
    setupTweaks();

    document.getElementById("next-btn").addEventListener("click", nextTurn);
    document.getElementById("prev-btn").addEventListener("click", prevTurn);
    document.getElementById("reset-btn").addEventListener("click", resetEncounter);
    document.getElementById("tracker-rows").addEventListener("click", handleRowClick);
    document.getElementById("tweaks-btn").addEventListener("click", toggleTweaks);
    document.getElementById("tweaks-close").addEventListener("click", toggleTweaks);
    document.getElementById("notes-btn").addEventListener("click", openNotesModal);
    document.getElementById("notes-modal-close").addEventListener("click", closeNotesModal);
    document.getElementById("notes-modal").addEventListener("click", e => {
      if (e.target.id === "notes-modal") closeNotesModal();
    });

    // Keyboard shortcuts: ←/→ for prev/next, space for next, Esc closes modal
    document.addEventListener("keydown", e => {
      if (e.key === "Escape") { closeNotesModal(); return; }
      if (e.target.matches("input, textarea, select")) return;
      if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); nextTurn(); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); prevTurn(); }
    });
  } catch (e) {
    showBootError("Encounter worksheet failed to load: " + (e && e.message ? e.message : "unknown error"));
    console.error(e);
  }
})();

</script>
