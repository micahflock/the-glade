<!DOCTYPE html>
<html lang="en" class="accent-ochre">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1B1308">
<title>Encounter — The Fête — Ant Guard Response</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Lora:ital,wght@0,400;0,500;0,600;0,700&family=JetBrains+Mono:wght@400;500;600;700&family=Special+Elite&display=swap">
<style>
/* ============================================================
   THE GLADE — Encounter Worksheet (dark-parchment plate)
   iPad-first landscape DM tool.
   ============================================================ */

:root {
  /* ─ Grounds: night plate ─ */
  --night-0:        #100B05;   /* deepest, page edge */
  --night-1:        #1B1308;   /* primary ground */
  --night-2:        #241A0E;   /* card surface */
  --night-3:        #2F2314;   /* hover / nested card */
  --night-4:        #3B2C1B;   /* active row */

  /* ─ Inks (warm parchment on night) ─ */
  --ink:            #EBDCB5;   /* primary */
  --ink-dim:        #C9B383;   /* secondary */
  --ink-mute:       #8E7549;   /* tertiary, metadata */
  --ink-ghost:      #5C4827;   /* near-invisible */

  /* ─ Rules ─ */
  --rule:           #4A3820;
  --rule-faint:     #322517;
  --rule-strong:    #6F5530;

  /* ─ Accent palette (Glade earth tones) ─ */
  --ochre:          #D69A45;
  --ochre-deep:     #8C5E1C;
  --vermilion:      #C44A30;
  --vermilion-deep: #7A1F12;
  --moss:           #8A9A4A;
  --moss-deep:      #44502A;
  --lapis:          #5A7FA3;
  --lapis-deep:     #2F4F6F;
  --cochineal:      #B04050;
  --cochineal-deep: #5A1A24;
  --umber:          #A06A3A;
  --umber-deep:     #4A2E14;

  /* ─ Semantic ─ */
  --accent:         var(--ochre);
  --accent-deep:    var(--ochre-deep);
  --danger:         var(--vermilion);
  --good:           var(--moss);

  /* ─ Type ─ */
  --font-display:   "IM Fell English", "EB Garamond", Georgia, serif;
  --font-label:     "IM Fell English SC", "EB Garamond", Georgia, serif;
  --font-plate:     "EB Garamond", "Hoefler Text", Georgia, serif;
  --font-body:      "Lora", "Iowan Old Style", Georgia, serif;
  --font-mono:      "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --font-hand:      "Special Elite", "Courier Prime", "Courier New", monospace;

  /* ─ Spacing ─ */
  --s-1: 4px;  --s-2: 8px;  --s-3: 12px; --s-4: 16px;
  --s-5: 24px; --s-6: 32px; --s-7: 48px;

  /* ─ Sizing (density tweakable) ─ */
  --row-pad-y:      6px;
  --row-pad-x:      10px;
  --row-gap:        4px;
  --base-fs:        15px;
}

.accent-ochre     { --accent: var(--ochre);     --accent-deep: var(--ochre-deep);     }
.accent-vermilion { --accent: var(--vermilion); --accent-deep: var(--vermilion-deep); }
.accent-moss      { --accent: var(--moss);      --accent-deep: var(--moss-deep);      }
.accent-lapis     { --accent: var(--lapis);     --accent-deep: var(--lapis-deep);     }
.accent-cochineal { --accent: var(--cochineal); --accent-deep: var(--cochineal-deep); }
.accent-umber     { --accent: var(--umber);     --accent-deep: var(--umber-deep);     }

/* Density */
.density-roomy   { --row-pad-y: 10px; --row-pad-x: 14px; --row-gap: 8px; }
.density-compact { --row-pad-y: 4px;  --row-pad-x: 8px;  --row-gap: 3px; }

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--night-1);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--base-fs);
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: rgba(0,0,0,0);
}
button { font: inherit; cursor: pointer; color: inherit; }
input { font: inherit; }
::selection { background: var(--accent); color: var(--night-0); }
h1, h2, h3 { margin: 0; font-weight: 400; }

/* parchment texture overlay — sparse foxing on the dark plate */
body::before {
  content: "";
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.6  0 0 0 0 0.5  0 0 0 0 0.3  0 0 0 0.05 0'/></filter><rect width='400' height='400' filter='url(%23n)'/></svg>");
  opacity: 0.5;
  mix-blend-mode: overlay;
}
body > * { position: relative; z-index: 1; }

/* ─── Topbar ────────────────────────────────────────────────── */
.topbar {
  position: sticky; top: 0; z-index: 50;
  background: linear-gradient(to bottom, var(--night-0), var(--night-1));
  border-bottom: 1px solid var(--rule);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 18px;
  gap: 18px;
}
.topbar-title {
  display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap;
}
.topbar-title h1 { white-space: nowrap; }
.topbar-title .eyebrow {
  font-family: var(--font-label);
  font-size: 10px;
  letter-spacing: 0.22em;
  color: var(--ink-mute);
  text-transform: uppercase;
}
.topbar-title h1 {
  font-family: var(--font-display);
  font-size: 26px;
  line-height: 1;
  color: var(--ink);
  letter-spacing: 0.01em;
  font-weight: 400;
}
.topbar-title h1 em { font-style: italic; color: var(--accent); }
.round-tag {
  font-family: var(--font-label);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-dim);
  border: 1px solid var(--rule);
  padding: 3px 10px;
  background: var(--night-2);
  white-space: nowrap;
}
.round-tag strong {
  font-family: var(--font-mono);
  font-weight: 700;
  color: var(--accent);
  margin-left: 4px;
  font-variant-numeric: tabular-nums;
}
.topbar-actions { display: flex; gap: 6px; align-items: center; }
.topbar-actions button {
  font-family: var(--font-label);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  padding: 8px 14px;
  background: var(--night-2);
  color: var(--ink-dim);
  border: 1px solid var(--rule);
  min-height: 38px;
}
.topbar-actions button:hover { color: var(--ink); border-color: var(--accent); }
.topbar-actions button:active { background: var(--night-3); }
.topbar-actions button.primary {
  background: var(--accent);
  color: var(--night-0);
  border-color: var(--accent);
  font-weight: 700;
}
.topbar-actions button.primary:hover { background: var(--accent-deep); color: var(--ink); }
.topbar-actions button.icon { padding: 8px 12px; }
.topbar-actions .sep { width: 1px; height: 24px; background: var(--rule); margin: 0 4px; }

/* ─── Main grid (landscape iPad first) ──────────────────────── */
.app {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(560px, 46%);
  gap: 18px;
  padding: 16px 18px;
  align-items: start;
}

/* ─── Initiative tracker ────────────────────────────────────── */
.tracker {
  background: transparent;
}
.section-head {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 12px;
  margin-bottom: 8px;
  padding: 0 2px;
}
.section-head h2 {
  font-family: var(--font-label);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--ink-dim);
}
.section-head .hint {
  font-family: var(--font-hand);
  font-size: 11px;
  color: var(--ink-mute);
  font-style: italic;
}

/* Muster bar — dial NPC counts at the table */
#muster:empty { display: none; }
#muster {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
  margin-bottom: 10px; padding: 8px 10px;
  border: 1px solid var(--rule); border-radius: 3px;
  background: var(--night-1, rgba(0,0,0,0.15));
}
.muster-label {
  font-family: var(--font-label);
  font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--ink-mute); margin-right: 4px;
}
.muster-item {
  display: inline-flex; align-items: center; gap: 0;
  border: 1px solid var(--rule); border-radius: 3px; overflow: hidden;
}
.muster-item .mus-name {
  font-size: 12px; color: var(--ink-dim);
  padding: 4px 8px; white-space: nowrap;
}
.muster-item .mus-count {
  font-family: var(--font-label);
  font-size: 13px; min-width: 22px; text-align: center;
  padding: 4px 2px; color: var(--ink);
  border-left: 1px solid var(--rule-faint);
  border-right: 1px solid var(--rule-faint);
}
.muster-item.none .mus-count { color: var(--ink-ghost); }
.muster-item button {
  background: none; border: none; cursor: pointer;
  color: var(--ink-dim); font-size: 15px; line-height: 1;
  padding: 5px 9px; min-width: 30px;
}
.muster-item button:hover { background: var(--rule-faint); color: var(--accent); }
.muster-item button:disabled { color: var(--ink-ghost); cursor: default; background: none; }

#tracker-rows {
  display: flex;
  flex-direction: column;
  gap: var(--row-gap);
}

.row {
  display: grid;
  grid-template-columns: 48px minmax(220px, auto) minmax(0, 1fr) 96px auto;
  gap: 10px;
  align-items: center;
  padding: var(--row-pad-y) var(--row-pad-x);
  background: var(--night-2);
  border: 1px solid var(--rule);
  border-left: 3px solid var(--rule-strong);
  position: relative;
}
.row > .info { min-width: 0; }
.row > .row-pills {
  display: flex; flex-wrap: wrap; gap: 4px;
  align-self: center;
  min-width: 0;
}
.row > .row-pills .pill {
  font-family: var(--font-label);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  background: var(--vermilion-deep);
  color: var(--ink);
  border: 1px solid var(--vermilion);
  padding: 2px 8px;
  line-height: 1.2;
}
.row.npc { border-left-color: var(--accent); }
.row.pc  { border-left-color: var(--good); }
.row.active {
  background: var(--night-4);
  border-color: var(--accent);
  border-left-width: 4px;
  box-shadow: inset 0 0 0 1px var(--accent-deep);
}
.row.focused:not(.active) {
  border-color: var(--ink-dim);
  background: var(--night-3);
}
.row.acted:not(.active) {
  opacity: 0.55;
}
.row.acted:not(.active) .name { color: var(--ink-mute); }
.row.dead {
  opacity: 0.4;
  background: var(--night-1);
  border-left-color: var(--rule);
}
.row.dead .name { text-decoration: line-through; color: var(--ink-mute); }

/* Init pill */
.row .init {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 20px;
  text-align: center;
  color: var(--ink);
  background: var(--night-0);
  border: 1px solid var(--rule);
  padding: 6px 0;
  width: 52px;
  height: 44px;
  -webkit-appearance: none;
  appearance: none;
  outline: none;
  font-variant-numeric: tabular-nums;
}
.row .init.empty { background: var(--night-1); color: var(--ink-mute); }
.row .init:focus {
  background: var(--night-2);
  border-color: var(--accent);
  color: var(--accent);
}
.row .init::placeholder { color: var(--ink-ghost); opacity: 1; }
.row.active .init { background: var(--accent); color: var(--night-0); border-color: var(--accent); }

/* Info column */
.row .info { min-width: 0; cursor: pointer; }
.row .name {
  font-family: var(--font-display);
  font-size: 17px;
  line-height: 1.15;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.row .name .group-tag {
  font-family: var(--font-label);
  font-size: 10px;
  color: var(--ink-mute);
  margin-left: 6px;
  letter-spacing: 0.1em;
}
.row .meta {
  display: flex; flex-wrap: wrap; gap: 6px 10px;
  margin-top: 2px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-dim);
  font-variant-numeric: tabular-nums;
  align-items: center;
}
.row .meta .ac { color: var(--ink); font-weight: 700; }
.row .meta .ac::before { content: "AC "; color: var(--ink-mute); font-weight: 400; }
.row .meta .speed { color: var(--ink-dim); }
.row .meta .init-mod {
  background: var(--night-0);
  border: 1px solid var(--rule);
  color: var(--good);
  padding: 0 6px;
  font-weight: 700;
}
.row .meta .init-mod::before { content: "INIT "; color: var(--ink-mute); font-weight: 400; }

/* HP column */
.hp-col {
  display: flex; flex-direction: column; gap: 3px; align-items: stretch;
  min-width: 96px;
}
.hp-display {
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
  white-space: nowrap;
  line-height: 1;
  text-align: right;
}
.hp-display .sep { color: var(--ink-mute); font-weight: 400; }
.hp-display .max { color: var(--ink-dim); font-weight: 500; }
.hp-display.low { color: var(--ochre); }
.hp-display.bloodied { color: var(--vermilion); }
.hp-display.dead { color: var(--ink-ghost); }
.hp-bar {
  width: 100%;
  height: 4px;
  background: var(--night-0);
  border: 1px solid var(--rule);
  position: relative;
  overflow: hidden;
}
.hp-bar-fill {
  position: absolute; inset: 0 auto 0 0;
  background: var(--good);
  transition: width 0.2s, background 0.2s;
}
.hp-bar-fill.low { background: var(--ochre); }
.hp-bar-fill.bloodied { background: var(--vermilion); }

/* Controls column */
.row .controls {
  display: flex; gap: 4px; align-items: center;
}
.row .controls input.amt {
  width: 44px; height: 32px;
  font-family: var(--font-mono);
  font-size: 13px;
  text-align: center;
  background: var(--night-0);
  color: var(--ink);
  border: 1px solid var(--rule);
  outline: none;
  -moz-appearance: textfield;
}
.row .controls input.amt::-webkit-outer-spin-button,
.row .controls input.amt::-webkit-inner-spin-button {
  -webkit-appearance: none; margin: 0;
}
.row .controls input.amt:focus { border-color: var(--accent); }
.row .controls input.amt::placeholder { color: var(--ink-ghost); }
.row .controls button {
  min-height: 32px;
  min-width: 32px;
  padding: 0 9px;
  border: 1px solid var(--rule);
  background: var(--night-0);
  color: var(--ink-dim);
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 700;
}
.row .controls button:hover { border-color: var(--accent); color: var(--ink); }
.row .controls button.dmg { color: var(--vermilion); border-color: var(--vermilion-deep); }
.row .controls button.dmg:hover { background: var(--vermilion-deep); color: var(--ink); }
.row .controls button.heal { color: var(--moss); border-color: var(--moss-deep); }
.row .controls button.heal:hover { background: var(--moss-deep); color: var(--ink); }
.row .controls button.cond {
  font-family: var(--font-label);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 0 10px;
}
.row .controls button.cond.has { color: var(--vermilion); border-color: var(--vermilion-deep); }
.row .controls button.cond.open { background: var(--accent); color: var(--night-0); border-color: var(--accent); }

/* Conditions popover */
.row .cond-panel {
  grid-column: 1 / -1;
  margin-top: 8px;
  padding: 10px;
  background: var(--night-0);
  border: 1px solid var(--rule);
  display: none;
}
.row .cond-panel.open { display: block; }
.row .cond-panel .pills {
  display: flex; flex-wrap: wrap; gap: 5px;
}
.row .cond-panel .pill-tog {
  font-family: var(--font-label);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  min-height: 30px;
  padding: 0 12px;
  background: var(--night-2);
  color: var(--ink-dim);
  border: 1px solid var(--rule);
}
.row .cond-panel .pill-tog:hover { color: var(--ink); border-color: var(--ink-dim); }
.row .cond-panel .pill-tog.on {
  background: var(--vermilion-deep);
  color: var(--ink);
  border-color: var(--vermilion);
}

/* ─── Active reference panel (sticky right) ─────────────────── */
.active-ref {
  position: sticky;
  top: 74px;
  max-height: calc(100vh - 90px);
  display: flex; flex-direction: column;
  background: var(--night-2);
  border: 1px solid var(--rule-strong);
  box-shadow: inset 0 0 0 1px var(--rule-faint);
  min-height: 480px;
}

.active-ref .empty {
  padding: 40px 24px;
  text-align: center;
  font-family: var(--font-hand);
  color: var(--ink-mute);
  font-style: italic;
}
.active-ref .empty strong {
  display: block;
  font-family: var(--font-display);
  font-style: normal;
  font-size: 20px;
  color: var(--ink-dim);
  margin-bottom: 8px;
  letter-spacing: 0.02em;
}

/* Header inside active ref */
.ar-head {
  padding: 14px 18px 12px;
  border-bottom: 1.5px solid var(--accent);
  flex-shrink: 0;
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  gap: 8px 24px;
}
.ar-head > .ar-head-main {
  flex: 1 1 240px;
  min-width: 0;
}
.ar-head .ar-eyebrow {
  flex: 1 1 100%;
  display: flex; justify-content: space-between; align-items: baseline;
  font-family: var(--font-label);
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.ar-head .ar-eyebrow .kind { color: var(--accent); }
.ar-head .ar-eyebrow .status { color: var(--ink-mute); }
.ar-head .ar-eyebrow .status.pinned { color: var(--ochre); }
.ar-head .ar-eyebrow .status.current { color: var(--accent); }
.ar-head h2 {
  font-family: var(--font-display);
  font-size: 26px;
  line-height: 1.05;
  color: var(--ink);
  letter-spacing: 0.01em;
  margin-bottom: 3px;
}
.ar-head .ar-recharge-row {
  flex: 1 1 100%;
  margin-top: 2px;
}
.ar-head .ar-caption {
  font-family: var(--font-plate);
  font-style: italic;
  font-size: 14px;
  color: var(--ink-dim);
  line-height: 1.3;
}

/* Supplementary header info (senses, pp, spell DC, etc — info NOT in the row) */
.ar-supp {
  margin: 4px 0 0;
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 4px 12px;
  font-size: 13px;
  line-height: 1.4;
  min-width: 0;
  flex: 0 1 auto;
  max-width: 240px;
}
.ar-supp dt {
  font-family: var(--font-label);
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-mute);
  padding-top: 2px;
}
.ar-supp dd {
  margin: 0;
  color: var(--ink);
  font-family: var(--font-body);
}
.ar-supp dd .num {
  font-family: var(--font-mono);
  font-weight: 700;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}
.ar-supp dd.passive .pp-val {
  font-family: var(--font-mono);
  font-weight: 700;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}

/* Stat strip: AC, HP roundels, speed, init */
.ar-stat-strip {
  display: grid;
  grid-template-columns: auto auto 1fr;
  gap: 14px;
  align-items: stretch;
  margin-top: 10px;
}
.ar-roundel {
  display: flex; flex-direction: column; align-items: center;
  padding: 6px 14px;
  background: var(--night-0);
  border: 1px solid var(--rule-strong);
  min-width: 64px;
}
.ar-roundel .label {
  font-family: var(--font-label);
  font-size: 9px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-mute);
}
.ar-roundel .val {
  font-family: var(--font-mono);
  font-size: 22px;
  font-weight: 700;
  color: var(--ink);
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
}
.ar-roundel.hp .val { color: var(--good); }
.ar-roundel.hp .val.low { color: var(--ochre); }
.ar-roundel.hp .val.bloodied { color: var(--vermilion); }
.ar-roundel .sub {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink-mute);
  font-variant-numeric: tabular-nums;
  margin-top: 1px;
}

/* Section blocks within tabs */
.ar-section {

}
.ar-section:last-child { margin-bottom: 0; }
.ar-section-head {

.kv-line {

  font-family: var(--font-label);

}

/* Action entry */
.action-entry {

}

/* Group head for nested action sections (TRAITS, ACTIONS, BONUS, REACTIONS) */
.action-group {
  margin-bottom: 14px;
}
.action-group:last-child { margin-bottom: 0; }
.action-group > .ar-section-head { color: var(--ink-dim); }

/* Tactics tab — readable, hierarchical */
.tactics-entry {

.attack-card {
  margin-bottom: 12px;

}
.attack-card.recharge { border-left-color: var(--moss); }

.attack-card .ac-meta {
  display: flex; align-items: center; gap: 8px;
  flex-shrink: 0;
  white-space: nowrap;
}
.attack-card .ac-type {
  font-family: var(--font-label);
  font-size: 9px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-mute);
  white-space: nowrap;
}
.attack-card .ac-recharge {
  font-family: var(--font-label);
  font-size: 9px;
  letter-spacing: 0.14em;
  color: var(--moss);
  border: 1px solid var(--moss-deep);
  padding: 2px 6px;
  background: var(--night-0);
  text-transform: uppercase;
  white-space: nowrap;
}
.attack-card.spent .ac-recharge { color: var(--vermilion); border-color: var(--vermilion-deep); }
.attack-card .ac-stats {
  display: grid;

  gap: 0;
  border-bottom: 1px solid var(--rule-faint);
}
.attack-card .ac-stat {
  padding: 6px 12px;
  border-right: 1px solid var(--rule-faint);
}
.attack-card .ac-stat:last-child { border-right: 0; }
.attack-card .ac-stat .lab {
  font-family: var(--font-label);
  font-size: 9px;
  letter-spacing: 0.16em;
  text-transform: uppercase;

  margin-bottom: 2px;
}
.attack-card .ac-stat .val {
  font-family: var(--font-mono);
  font-size: 15px;
  font-weight: 700;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.attack-card .ac-stat.hit .val { color: var(--accent); }
.attack-card .ac-stat.tohit .val { color: var(--good); }
.attack-card .ac-extra {
  padding: 8px 12px 10px;
  font-size: 13px;
  line-height: 1.5;
  color: var(--ink);
}
.attack-card .ac-extra .num {
  font-family: var(--font-mono);
  font-weight: 700;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}
.attack-card.no-stats .ac-stats { display: none; }
.attack-card.no-stats .ac-head { border-bottom: 0; }

/* Encounter notes modal */
.modal-shade {
  display: none;
  position: fixed; inset: 0;
  background: rgba(8, 4, 1, 0.75);
  z-index: 200;
  align-items: center; justify-content: center;
  padding: 32px;
}
.modal-shade.open { display: flex; }
.modal {
  background: var(--night-2);

}
.modal-head {

}

}
.modal-head .modal-close {
  background: transparent;

  font-size: 24px;

}
.modal-head .modal-close:hover { color: var(--vermilion); }
.modal-body {
  padding: 16px 18px 22px;

}

/* ─── Full reference (below tracker) ────────────────────────── */
.full-ref {
  grid-column: 1 / -1;
  padding: 0 18px 40px;
  margin-top: 8px;
}
.full-ref details {
  background: var(--night-2);

  margin-bottom: 8px;
}
.full-ref summary {
  list-style: none;

  background: var(--night-0);
  border-bottom: 1px solid var(--rule);

  font-family: var(--font-label);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;

}
.full-ref summary::-webkit-details-marker { display: none; }
.full-ref summary::after { content: "▼"; font-size: 9px; color: var(--ink-mute); }
.full-ref details[open] summary::after { content: "▲"; }
.full-ref details[open] summary { border-bottom-color: var(--accent); color: var(--ink); }
.full-ref-body { padding: 14px 16px; }

.full-block {

}
.full-block:last-child { margin-bottom: 0; }
.full-block-title {

}

}

.notes-entry {

}
.notes-entry:last-child { margin-bottom: 0; }
.notes-entry .note-label {

  text-transform: uppercase;

}
.notes-entry .note-text {

#tweaks {

  border: 1px solid var(--accent);

.tweak-label {

}

}
.tweak-swatch.on { border: 2px solid var(--ink); }

}
.tweak-radio { display: flex; gap: 4px; }
.tweak-radio button {

}

/* ─── Responsive: portrait / narrow ─────────────────────────── */
@media (max-width: 1100px) {
  .app {
    grid-template-columns: 1fr;
  }
  .active-ref {
    position: static;
    max-height: none;
    order: -1;

}

@media print {
  .topbar-actions, #tweaks, .row .controls, .row .cond-panel { display: none; }

  .active-ref { position: static; max-height: none; }
}

var ENCOUNTER = {"name": "The Fête — Ant Guard Response", "slug": "fete_ant_guard_response", "roster": [{"id": "guard", "name": "Red Ant Guard", "ac": 14, "hp_dice": "4d8", "speed": "30 ft., climb 30 ft.", "init_mod": "+1", "start": 2, "notes": "Cleaves. Charge = 2 rds, kills the firer."}, {"id": "bulwark", "name": "Royal Ant Bulwark", "ac": 17, "hp_dice": "10d10+50", "speed": "20 ft., climb 20 ft.", "init_mod": "-1", "start": 0, "notes": "Slow. Pin + Interpose. Resists fire."}, {"id": "firecaller", "name": "Royal Ant Firecaller", "ac": 15, "hp_dice": "12d8+24", "speed": "30 ft., climb 30 ft.", "init_mod": "+2", "start": 0, "notes": "Kill first. Kindled ends when it dies."}], "combatants": [{"id": "tabby", "kind": "pc", "name": "Tabatha Starr (Heather)", "ac": 15, "hp_max": 42, "hp_current": 42, "speed": "30 ft.", "initiative": null, "init_mod": "+6", "notes": "Dread Ambusher rd 1: +10 speed, extra attack, +1d8 on hit. Invisible to darkvision while in darkness."}, {"id": "nancy", "kind": "pc", "name": "Nancy Alfons (Rowyn)", "ac": 16, "hp_max": 37, "hp_current": 37, "speed": "40 ft.", "initiative": null, "init_mod": "+4", "notes": "Bladesong: AC 19, speed 50. Mobile: no OAs from a target she melees."}, {"id": "drix", "kind": "pc", "name": "Jiminy Hendrix (Drix — Katie)", "ac": 15, "hp_max": 39, "hp_current": 39, "speed": "30 ft.", "initiative": null, "init_mod": "+3", "notes": "Save DC 16. Hypnotic Pattern and Counterspell available."}], "npc_blocks": [{"title": "Red Ant Guard — Medium Monstrosity (ant), Lawful Neutral — ORDINARY, not the elite", "stats": "AC 14 (chitin and ceremonial plate) | HP 18 (4d8) | Speed 30 ft., climb 30 ft. | STR 14 (+2) DEX 12 (+1) CON 10 (+0) INT 8 (-1) WIS 12 (+1) CHA 10 (+0)", "defenses": "Skills: Perception +5 | Senses: darkvision 60 ft., tremorsense 30 ft. | Passive Perception 15 | Languages: Ant-cant (chemical) | CR 1/2 (100 XP) | PB +2", "sections": [{"label": "TRAITS", "entries": [{"name": "Overexcited", "text": "This guard is watching everything, all at once, and has been all night. It startles at a dropped tray, at laughter, at movement in the petal panels. It notices an enormous amount and can tell almost none of it apart. While it is standing its post in a public room it makes Wisdom (Perception) checks with disadvantage — passive Perception 10, because every single thing it has flagged so far tonight has been nothing. Back-corridor patrols away from the crowd use the full 15."}, {"name": "Overkill (Cleave)", "text": "When a single attack reduces a Red Ant Guard to 0 hit points, damage in excess of its remaining hit points carries over to one other Red Ant Guard within 5 ft. of it, and can chain onward the same way while excess remains. Overkill damage never carries to or from a Royal Ant Bulwark, a Royal Ant Firecaller, or any non-ant creature. Temporary hit points (see the Firecaller's Royal Cadence) stop the chain — excess is absorbed, not passed."}]}, {"label": "ACTIONS", "entries": [{"name": "Mandible Jab", "text": "Melee Weapon Attack: +4 to hit, reach 5 ft., one target. Hit: 6 (1d8+2) piercing damage."}, {"name": "Stoke the Gaster", "text": "The guard plants its legs and pumps its fire gland. Its abdomen swells, glows, and hisses — anyone who can see it knows exactly what is coming, and so does the guard. Until the end of its next turn the guard is Charged, and its speed is 0. If it takes 5 or more damage from a single source while Charged, the charge ruptures: the charge is lost and the guard takes 7 (2d6) fire damage — which is, from the guard's side of it, a reprieve. Round one of the two-round charged attack."}, {"name": "Ember Lance (Charged only)", "text": "The guard vents its charged gaster in a line 30 ft. long and 5 ft. wide. Each creature in the line makes a DC 12 Dexterity saving throw, taking 21 (6d6) fire damage on a failure or half as much on a success. Flammable objects in the line that aren't worn or carried ignite — and the outward-facing palace is built of dried flower petals. The line does not spare allies, and Red Ant Guards do NOT resist fire. A lance fired into a melee cooks the guards standing in it. The royals (Bulwark, Firecaller) resist fire and walk through it. THE GUARD DOES NOT SURVIVE IT. Venting the gland burns it hollow from the inside; the guard drops to 0 hit points and dies as the lance goes out, leaving a husk that goes on burning for a minute and will light whatever it is lying against. Every red ant knows this is what the lance costs. Round two — and the last round — of the two-round charged attack."}]}, {"label": "TACTICS", "entries": [{"name": "How it fights", "text": "On post, two to an aperture, facing outward. In the open they fight in numbers and stand their ground rather than disengaging — they hold the line and make noise while they do it, which is what summons the royal squad. Left to themselves they jab, because Ember Lance kills them and they know it. A guard stokes its gaster under three conditions and no others: a Firecaller orders it (Volunteer), a superior is watching and it has already failed once tonight, or it is going to die anyway and can take someone with it. That makes the lance rare and dreadful rather than routine — and it means the moment a gaster starts to glow, the party is looking at an ant that has just been spent."}]}]}, {"title": "Royal Ant Bulwark — Large Monstrosity (ant), Lawful Neutral — ELITE", "stats": "AC 17 (natural armor) | HP 105 (10d10+50) | Speed 20 ft., climb 20 ft. | STR 18 (+4) DEX 8 (-1) CON 20 (+5) INT 7 (-2) WIS 12 (+1) CHA 10 (+0)", "defenses": "Saves: STR +6, CON +7 | Skills: Athletics +6, Perception +3 | Resist: fire | Senses: darkvision 60 ft., tremorsense 30 ft. | Passive Perception 13 | Languages: Ant-cant (chemical) | CR 3 (700 XP) | PB +2", "sections": [{"label": "TRAITS", "entries": [{"name": "Ponderous", "text": "The Bulwark can't take the Dash action and has disadvantage on Dexterity saving throws. It is slow on purpose — the party can outrun it r is still in reach. Spends its reaction on Interpose to keep the Firecaller alive. Will not pursue past the door it was told to hold."}]}]}, {"title": "Royal Ant Firecaller — Medium Monstrosity (ant), Lawful Neutral — ELITE, support", "stats": "AC 15 (chitin and censer-regalia) | HP 78 (12d8+24) | Speed 30 ft., climb 30 ft. | STR 10 (+0) DEX 14 (+2) CON 14 (+2) INT 14 (+2) WIS 16 (+3) CHA 14 (+2)", "defenses": "Saves: CON +4, WIS +5 | Skills: Perception +5, Insight +5 | Resist: fire | Senses: darkvision 60 ft., tremorsense 30 ft. | Passive Perception 15 | Languages: Ant-cant (chemical, fluent), Common | CR 3 (700 XP) | PB +2", "sections": [{"label": "TRAITS", "entries": [{"name": "Pheromone Standard", "text": "Spell save DC 13, spell attack +5. Allied ants within 30 ft. of the Firecaller can't be Frightened and have advantage on saving throws against being Charmed. Ordinary guards do not break while it is standing."}, {"name": "Royal Chitin", "text": "Overkill (Cleave) damage never carries to or from a Firecaller."}]}, {"label": "ACTIONS", "entries": [{"name": "Kindle the Host", "text": "The Firecaller opens its censer and breathes over up to three allied ants it can see within 30 ft. Each becomes Kindled for 1 minute: its carapace runs hot enough to read by, and any creature that is not a red ant and ends its turn within 5 ft. of it takes 2 (1d4) fire damage. This damage is rolled per Kindled ant — a creature ending its turn inside a knot of three Kindled guards rolls 3d4, averaging 7–8. Kindled ends early on any ant that drops, and ends on ALL of them the instant the Firecaller dies. This is the block's main action and usually its whole first turn."}, {"name": "Cinder Bolt", "text": "Ranged Spell Attack: +5 to hit, range 60 ft., one target. Hit: 10 (3d6) fire damage. What it does on the turns it has nobody left worth heating. There is no multiattack — this creature is not a nuke."}]}, {"label": "BONUS ACTIONS", "entries": [{"name": "Royal Cadence", "text": "Up to three allied ants within 30 ft. that can smell the Firecaller each gain 5 temporary hit points. Temporary hit points from Royal Cadence stop an Overkill (Cleave) chain — excess damage is absorbed rather than passed on. This is the deliberate counter to the party mowing down Red Ant Guards, and it costs the Firecaller its bonus action every round it wants it."}, {"name": "Volunteer", "text": "The Firecaller lays a claw on one Red Ant Guard within 30 ft. and names it. That guard immediately becomes Charged (as Stoke the Gaster) without spending its own action, and its speed is not reduced; it can use Ember Lance on its own next turn. Ember Lance kills the guard that fires it, and both of them know that. An ordinary guard will not stoke its own gaster in a fight it expects to survive — this is how the lance actually reaches the table, and it is the Firecaller spending a life to do it."}]}, {"label": "TACTICS", "entries": [{"name": "How it fights", "text": "Stays behind the Bulwarks and holds 30 ft. Turn one is Kindle the Host on whichever three guards are closest to the party, plus Volunteer on a guard with a clean lane. Turn two heats three more and starts Royal Cadence once the party begins dropping mooks. Cinder Bolt only when there is nothing left to buff. Does not chase, does not press a losing fight, and will fall back to call the next batch — its job is to make the swarm expensive, not to win the fight itself."}]}]}], "pc_blocks": [{"header": "Tabatha Starr (Heather) — Ranger 6 (Gloomstalker) | Lone Star Tick | AC 15 | HP 42 | Speed 30 | Passive Perception 15", "abilities": "STR 14 (+2) DEX 18 (+4) CON 12 (+1) INT 10 (+0) WIS 14 (+2) CHA 10 (+0)", "saves": "STR +5 (prof), DEX +7 (prof). CON +1, INT +0, WIS +2, CHA +0.", "attacks": "Longbow +9, 1d8+4 piercing (150/600) [Archery]  |  Mantis-spine dagger +7, 1d8+4 slashing (finesse; invisible 1x/short rest)  |  Dagger +7 melee / +9 thrown, 1d4+4 piercing  |  Extra Attack (2 attacks)  |  Sharpshooter: -5 to hit for +10 damage; ignores half and 3/4 cover; no long-range disadvantage.", "spells": "Save DC 13, attack +5. 1st (3/4 left): Hunter's Mark (BA), Disguise Self, Speak with Animals, Jump. 2nd (2/2): Pass without Trace, Rope Trick.", "features": "Dread Ambusher: +WIS to initiative; rd 1 of combat +10 speed and one extra attack that deals +1d8 on a hit. Umbral Sight: darkvision 60 ft. and INVISIBLE to darkvision-users while in darkness — matters if the party douses the glowworm lanterns. Stealth +7."}, {"header": "Nancy Alfons (Rowyn) — Rogue 4 (Arcane Trickster) / Wizard 2 (Bladesinger) | Jumping Spider | AC 16 (19 Bladesong) | HP 37 | Speed 40 (50 Bladesong) | Passive Perception 11", "abilities": "STR 6 (-2) DEX 18 (+4) CON 12 (+1) INT 16 (+3) WIS 12 (+1) CHA 12 (+1)", "saves": "DEX +7 (prof), INT +6 (prof). STR -2, CON +1, WIS +1, CHA +1. NOTE: STR -2 and no STR-save proficiency — escaping a Bulwark's Pin (DC 14) is best attempted with Acrobatics (+4), not Athletics (-2).", "attacks": "Rapier +7, 1d8+4 piercing  |  The Mantible +7, 1d8+4 slashing (finesse; invisible 1x/short rest)  |  Shortbow +7, 1d6+4 piercing (80/320)  |  Sneak Attack 2d6  |  Green-Flame Blade / Sword Burst cantrips.", "spells": "Save DC 14, attack +6. Cantrips: Mage Hand (Legerdemain), Message, Minor Illusion, Green-Flame Blade, Mending, Sword Burst. 1st (4): Shield, Sleep, Tasha's Hideous Laughter, Disguise Self, Detect Magic, Identify, Tenser's Floating Disk. 2nd (2): Misty Step (also 1/long rest free via Fey Touched).", "features": "Bladesong (BA, 1 min, 3/long rest): +3 AC, +10 speed, advantage on Acrobatics, +3 concentration saves, +3 damage once per turn. Mobile: +10 speed; melee a creature and it can't take OAs against you. Cunning Action (BA dash/disengage/hide). Uncanny Dodge. Stealth +7, Sleight of Hand +10, Investigation +9."}, {"header": "Jiminy Hendrix (Drix — Katie) — Bard 6 (College of Lore) | Cricket | AC 15 | HP 39 | Speed 30 | Passive Perception 13", "abilities": "STR 6 (-2) DEX 16 (+3) CON 13 (+1) INT 10 (+0) WIS 10 (+0) CHA 20 (+5)", "saves": "DEX +6 (prof), CHA +8 (prof). STR -2, CON +1, INT +0, WIS +0.", "attacks": "Rapier +6, 1d8+3 piercing  |  Shortsword +6, 1d6+3 piercing  |  Vicious Mockery cantrip (DC 16, 2d4 psychic + disadvantage on its next attack).", "spells": "Save DC 16, attack +8. Cantrips: Vicious Mockery, Prestidigitation, Dancing Lights. 1st (4): Healing Word, Silvery Barbs, Dissonant Whispers, Disguise Self, Unseen Servant. 2nd (3): Hold Person, Locate Animals or Plants. 3rd (3): HYPNOTIC PATTERN, Counterspell, Phantom Steed, Leomund's Tiny Hut.", "features": "Bardic Inspiration d8, 5 uses, short rest (BA, 60 ft.). Cutting Words (reaction: subtract a d8 from an enemy roll). Jack of All Trades. Song of Rest d6. Expertise: Performance +11, Persuasion +11. Deception +11."}], "notes": [{"label": "How to use this sheet", "text": "The Muster bar above the tracker is the point — nothing is pre-staged. Dial in whatever the scene calls for and roll initiative at the table. It opens on a back-corridor patrol of 2 Red Ant Guards; add more, or add royals, as the night escalates. Removing a creature takes the highest-numbered one off. Counts and HP persist until you hit Reset."}, {"label": "Alert ladder — what to muster", "text": "L1 NOTICED (a fight heard, Beeatrix screams, a body found): 4-6 Red Ant Guards, no royals. L2 SQUAD (enough noise, or something specifically suspicious): add 1 Firecaller + 1 to 3 Bulwarks. L3 WILDLY OUT OF HAND (fire, an open running fight in a public room, the coronation disrupted): 8-12 guards plus a second squad. L4 LOCKDOWN: everything clusters on the Red Ant Queen, which is the party's opening to escape."}, {"label": "Encounter math (3 PCs at level 6)", "text": "Thresholds: Easy 900 / Medium 1800 / Hard 2700 / Deadly 4200. Patrol pair = 200 raw, 300 adjusted — trivial, and meant to be. 6 guards = 600 raw, 1200 adjusted. Minimum squad (1 Firecaller + 1 Bulwark) = 1400 raw, 2100 adjusted, just under Hard. Standard (1 + 2) = 2100 raw, 4200 adjusted — exactly Deadly. Maximum (1 + 3) = 2800 raw, 5600 adjusted. Maximum plus 6 guards = 3400 raw, 8500 adjusted — not a fight, that is the run-to-the-kitchens signal."}, {"label": "OVERKILL (cleave) — house rule", "text": "When one attack drops a Red Ant Guard to 0, the excess damage carries to another Red Ant Guard within 5 ft., and chains on while excess remains. Red Ant Guards ONLY — never to or from a Bulwark or a Firecaller (Royal Chitin). Temporary hit points stop the chain, which is exactly what the Firecaller's Royal Cadence is for. Written for single-target attacks, melee or ranged; area spells already hit everyone, so they do not cleave."}, {"label": "The charge, and what it costs", "text": "Stoke the Gaster is a visible tell — abdomen swelling, glowing, hissing — and the guard's speed drops to 0 while it holds. 5+ damage from one source ruptures it (charge lost, 2d6 to itself). Ember Lance then does 6d6 in a 30 ft. line, DC 12 DEX for half, AND KILLS THE GUARD THAT FIRED IT. Left alone, guards will not do this; it takes a Firecaller's Volunteer, a superior watching after they already failed once, or a guard that is dying anyway."}, {"label": "Fire in a petal palace", "text": "Bulwarks and Firecallers RESIST fire. Red Ant Guards DO NOT — an Ember Lance fired into a scrum cooks the guards standing in it, and so does an Emberbloom. The outward-facing rooms are dried flower petals: loose flammables in a lance's line ignite, a spent guard leaves a husk that burns for a minute and lights whatever it is lying against. Fire is the fastest way for either side to lose control of the night."}, {"label": "The scary setup", "text": "Bulwark Pins a PC (speed 0, attacks against them have advantage, disadvantage on DEX saves) -> Firecaller Volunteers a guard -> Ember Lance down the line the PC cannot leave, saving at disadvantage. Against Nancy at 37 HP that chain is close to lethal, and her escape check should be Acrobatics +4, not Athletics -2."}, {"label": "Kindled — track it on the pills", "text": "Kindle the Host heats up to 3 allied ants for 1 minute. Anything that is not a red ant and ends its turn within 5 ft. of a Kindled ant takes 1d4 fire, ROLLED PER KINDLED ANT — a knot of three is 3d4. This is the tax on wading into the pack to cleave, and it lands almost entirely on Nancy. Kindled ends on ALL of them the moment the Firecaller dies. Use the Kindled and Charged condition pills to track who is what."}, {"label": "Terrain", "text": "Back corridors and service passages: lit by glowworm lanterns in jiggly sacks — staff can douse them, and so can the party, which hands Tabby total concealment (Umbral Sight makes her invisible to darkvision in darkness). Guards on post in a public room have passive Perception 10; the same guard on a back-corridor patrol uses its full 15. Rooms hang separately and are joined by open-air walkways and flying buttresses — a fight on a walkway has a long drop into the Overgrowth on both sides."}, {"label": "Registry cross-ref", "text": "None of these three are tracked in memory/NPC_Registry.yaml — they are generic palace forces, not named NPCs. Nothing to reconcile."}, {"label": "FLAG — party sheet inconsistency", "text": "The Mantible (the orchid mantis mandible short sword) is listed in BOTH Nancy's and Drix's equipment. Session 6.5 notes say Nancy took the mandible and Tabby took the spines. Drix's copy is probably duplication — worth a /janitor pass, and worth knowing before someone claims it at the table."}]};
