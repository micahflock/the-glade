    party_history:
      - "Session 3: Survived the road encounter. Impressed by party's quest to understand the Bloom. Offered to guide party to the Winter Farm."
      - "Session 4: Guided the party through the farm once they were past the entrance. Confirmed 'the Sporemother does not like the fire ants' after Drix dropped disguise. Led them through twisting leafcutter-only tunnels to the fungal curtain chamber, then walked away — he did not know how to proceed further. Party sentiment at end of session: 'Allen rules.'"

    hooks:
      - Potential long-term ally if the party earns trust
      - Still inside the Winter Farm; could aid or be endangered by future events


  - name: Greg
    species: Leafcutter ant
    role: Body cart worker, alliance loyalist (discredited)
    status: Alive — at large inside the Winter Farm, credibility destroyed
    location: Winter Farm interior (disappeared among the workers)
    disposition: Hostile (covert), but discredited
    first_met: Session 3
    last_seen: Session 4

    voice: Panicked, urgent. Mandibles clicking fast.
    motivation: Survival. Believes the alliance is the only rational path. Terrified of consequences now that fire ants are dead and he's implicated.
    personality: Not evil — practical. His framework is follow the queen, do what you're told, survive. Now that framework has collapsed.

    party_history:
      - "Session 3: Cowed by Nancy ('might makes right doesn't sit with me') but not won over. Planning to betray the party at earliest opportunity."
      - "Session 4: Nancy sent him a Message — 'I'm watching you and I will kill you if you act out.' He rolled a 6 on his save and held his nerve only until the descent. As the party approached the farm entrance, Greg broke and bolted across the frozen river toward the farm. Drix — in fire-ant disguise — pre-emptively yelled that Greg was 'acting crazy and has a fungus in his brain.' Greg's credibility collapsed before he arrived; he disappeared into the leafcutter workers. Party sentiment: 'Greg sucks.'"

    hooks:
      - At large inside the farm; could resurface as a ragged, discredited antagonist later
      - Ran into cover with a story that nobody believed — lives in shame among his own


  # NOTE: Bessie and Bestie are two different animals — see their entries.
  # Both spellings are correct where they appear; do not "normalize" them.

  - name: Sporemother Vell
    aka: >
      Appears as "Grainmother Vell" in sessions/final/s03_final.md — a
      forward-reference written before the title settled. Sporemother is canon.
    species: Leafcutter ant
    role: Rebel cell leader, senior fungal tender
    affiliation: Winter Farm — rebel cell
    status: Alive
    location: Winter Farm — rebel cell chamber, behind the fungal curtain
    disposition: Allied
    first_met: Session 4
    last_seen: Session 4

    appearance: Old enough that her generation remembers life before the Bloom. A matriarch — something above Worker but below Queen. A senior tender.
    voice: Measured, deliberate. Every word placed carefully — she's still getting used to the idea that words can change things if you arrange them right.
    motivation: Personal, not political. She can't tend her leaf fungus gardens anymore. The old ways are gone. That's what drives her — not ideology, but the loss of the thing she was born to do and did beautifully.
    personality: Fiery underneath steely composure. Maternal in the way of someone who raised an entire fungus garden for decades and watched it taken away. Leafcutters have always just done what their queen wants — rebellion is a totally new concept. Vell is discovering what leadership means in real time.

    key_dialogue:
      - "'I've been growing things my whole life. I know what fungus needs. I know what soil needs. I know what happens when you take the rot out of the world and leave everything perfect and green and completely, utterly useless.'"
      - "'The red queen took our queen. Took our purpose. Turned us into gravediggers. And my people just… did it. Because that's what we do. We're told, and we do.'"
      - "'I don't think it's supposed to work like this.'"
      - "If the party reveals their quest: 'If what you're doing works — if things can rot again — we don't need the red ants. The alliance falls apart on its own.'"

    party_history:
      - "Session 4: Met by the party in the rebel cell chamber after they solved the fungal curtain. Parleyed with Nancy. Confirmed the source of the Bloom. Mentioned that her home is the Overgrowth. Alluded to other powers given to other species beyond fire ants. Described the red queen as subject to moodiness. Gave the party the mandate to bring news of the Bloom's source to the leafcutter queen — not to free her, but to tell her there is an alternative so she can choose to break the alliance on her own terms. Arranged escort (Antshley) through the tunnel into the Overgrowth."

    cell_members:
      - "Older assistant / nervous doubter — carved the Runes of Fungal Protection onto each party member. Believes in the old superstitions. [name not yet established]"
      - "One or two other leafcutters at the table, quieter, unnamed."

    hooks:
      - Core dilemma she voices: "Even if we overthrow them… how do we eat?"
      - The rebellion is inept — leafcutters have never organized laterally before. Vell is learning leadership in real time.
      - Her home is the Overgrowth — displaced from it by the alliance.


  - name: Antshley
    species: Leafcutter ant
    role: Rebel escort — handed the party off at the Overgrowth tunnel mouth
    affiliation: Winter Farm — rebel cell (Sporemother Vell's cell)
    status: Alive
    location: Returned via the rebel tunnel toward the Winter Farm
    disposition: Allied (player affection — Heather flagged with a heart)
    first_met: Session 4
    last_seen: Session 5

    party_history:
      - "Session 4: Volunteered at the rebel cell meeting to escort the party to the leafcutter queen. Led them back through the Winter Farm tunnels, under the unseen barrier, and into the Overgrowth. Traveling with the party as of end of session."
      - "Session 5: Walked the party through the gradient tunnel where dirt walls become living vegetation. Stopped before the daylight mouth — too risky for her to be topside, can't expose her cell. Handed Tabby the navi-gus (a smooth translucent ball of fungus keyed to Canopia, responsive to leafcutter pheromone trails). Briefed them on the dead drop method at the Dewdrop Inn. Said her goodbyes ('You've given us hope — hope that we don't struggle just to be met with starvation') and turned back."

    hooks:
      - Heather has attached to this character — treat as developed recurring NPC, not disposable
      - Re-entry vector — does she rejoin the party at the queen audience, or stay in her cell?


  - name: The Old Assistant
    species: Leafcutter ant
    role: Rebel cell member, rune-carver, nervous doubter
    affiliation: Winter Farm — Sporemother Vell's cell
    status: Alive
    location: Winter Farm — rebel cell chamber
    disposition: Allied (anxious)
    first_met: Session 4
    last_seen: Session 4

    voice: Anxious, theatrical worry. "Some call it superstition, but us old-timers still believe in it."
    motivation: Remembers the old ways too well. Terrified of what happens if the rebellion fails.
    personality: The nervous doubter role from the draft — voices the counter-argument of "but if we stop, we starve." Old enough to carry the old superstitions and the old rites.

    key_items_given_to_party:
      - Rune of Fungal Protection carved onto each party member's carapace. Protects against fungal infection. [Mechanical effect TBD.]
      - "Nancy: top of the right pauldron / shoulder"
      - "Drix: lower back ('tramp stamp')"
      - "Tabby: back of the left shoulder"

    party_history:
      - "Session 4: Carved the Runes of Fungal Protection onto all three PCs. Delivered exposition about magic escalation — the red queen 'wreathed in fire,' the leafcutter queen's unnatural fungal obsession."

    hooks:
      - Name not yet established at the table. [DM CHECK]
      - The rune's mechanical effect is deferred. Specify before the cordyceps payoff arrives.


  - name: Twyla
    species: Weevil
    role: Weevilville aid coordinator — runs fungus distribution
    affiliation: Weevil aid network (the team the Weevilville is named after)
    status: Alive
    location: Weevilville (base of Canopia's tree)
    disposition: Allied (warm, civic, knows-everyone-by-name)
    first_met: Session 5
    last_seen: Session 5

    appearance: Diminutive weevil in a clean apron, bark-board tally clipboard in tiny claws.
    voice: Warm, busy, professional. Calls families up by name. Has a kind word for each pack of fungus handed out.
    motivation: Feeds her people. Believes in the aid effort. Doesn't appear to know — or doesn't say — that the fungus comes from the Winter Farm corpse operation; assumes "they have a farm on the outside" and that it's made from leaves.
    personality: Kind. Earnest. Knows every detritivore family by name. Personally fond of gambling at the Queen's Crown.

    info_shared_with_party:
      - "The fungus comes from a farm on the outside; she assumes it's made from leaves."
      - "Fire ants protect the leafcutters from predation, which has gotten worse."
      - "Leafcutters are the backbone of the new normal — feeding detritivores, keeping the roads open."
      - "Nectar-eaters and fresh-veggie-eaters are doing great. Things that eat them are doing great too."
      - "Many displaced detritivores have found work in Canopia keeping the city running."
      - "Directions to the Dewdrop Inn; passing mention of the Mayflyer."

    party_history:
      - "Session 5: Let Nancy and Tabby help hand out fungus rations at the cart in the Weevilville square. Friendly. Gave directions to the Dewdrop Inn."

    hooks:
      - Gambling habit puts her at the Queen's Crown — natural re-entry vector if the party returns to attempt a heist.
      - Does she actually know where the fungus comes from? Tonal: play her as suspecting but not confirming.


  - name: Gleam
    species: Weevil
    role: Rebel cell contact in Canopia — handoff toward the Leafcutter Queen
    affiliation: >
      Rebel network (separate cell, linked to Sporemother Vell's).
      Publicly, a member of the Weevilville Board of Groupees — the respectable
      civic body whose fête invitation allotment he used to get the party in.
    status: Alive
    location: Upstairs room, Dewdrop Inn, Canopia
    disposition: Allied (party verdict at the table — "THE CUTEST")
    first_met: Session 5
    last_seen: Session 6

    appearance: Beady eyes. Long, expressive snout. Extremely earnest. Long brown robe and a hood up when sneaking, which he is bad at.
    voice: Earnest, kind, warm. No talent for subterfuge — opens with "I'm glad you could make it" while still beaming.
    motivation: Personally invested in the rebellion. Humanitarian. Believes the alliance's cheerful soft power is the danger.
    personality: Awkward. Kind. Sincere. Verifies the runes Vell carved onto the party before fully relaxing.

    info_shared_with_party:
      - "Vell's cell sent word ahead. The rebel network is bigger than Vell's single cell."
      - "The Leafcutter Queen knows something is wrong. She made a bad deal and is constrained — not an enemy."
      - "He can get the party into the hive (the joint ant nest) through his contacts. Another rebel cell operates inside; they will move the party to the queen for an audience."

    party_history:
      - "Session 5: Made contact in the upstairs room of the Dewdrop Inn after the party ran the dead drop cleanly. Session ended partway through the conversation — concrete handoff plan still owed."

    hooks:
      - "[CARRY-FORWARD] Specific mechanism for entering the hive — cart, bribe, shift change, pheromone-lock — must be written before Session 6 opens."
      - The in-hive cell has reportedly been preparing for "something bigger." Gleam has not foreshadowed this directly to the party yet.


  - name: Dale
    role: Bartender — Dewdrop Inn; runs the rebel dead drop
    species: Unspecified (bug equivalent of a mustache)
    affiliation: Rebel network (Canopia cell, with Gleam)
    status: Alive
    location: Dewdrop Inn, Canopia
    disposition: Allied (operational; pretends not to be)
    first_met: Session 5
    last_seen: Session 7

    appearance: Bug equivalent of a mustache. Professional bearing.
    voice: Unflappable. Practiced apology. Slips operational instructions into a remake-the-drink monologue without breaking stride. Warm by daylight — friendly nod, antennae twitch.
    personality: Pro. Aware of every angle of the dead drop he is running and entirely practiced at not appearing to be running it. Has a soft spot for Beeatrix — wishes someone would help her, partly out of compassion and partly to stop the yelling.

    party_history:
      - "Session 5: Ran the ginger honeycap / 'it's a hot batch' / back-booth handoff cleanly. Did not need to deploy any of the failure-recovery branches."
      - "Session 6: Name confirmed as Dale. Served the party breakfast (greenery cakes, mite meat, BBV beverages) in the empty morning bar. Half-mumbled the wish-someone-would-help-her line about Beeatrix, then went over and patted her back. Told the party they could book or find flight travel to the east."
      - "Session 7: Tending bar during the Beeatrix reunion (thin evening crowd). Got the wish he'd half-mumbled — someone helped her."

    hooks:
      - Probably a recurring point of contact in Canopia for as long as the party uses the Dewdrop Inn as a node.


  - name: Beeatrix
    species: Mining bee
    role: Grieving / hungover singer at the Dewdrop Inn; quest-giver for the mantis hunt; *recruited to front the band at the Red Ant Queen's fete*
    affiliation: None (solitary bee, displaced)
    status: Alive — recovering; sent home sober ahead of the fete
    location: Sent home (Canopia) — declined the casino at the party's urging
    disposition: Allied (grateful; the party's singer)
    first_met: Session 6
    last_seen: Session 7

    appearance: Rough-looking. Slumped at the bar, snoring quietly. The singer the party heard wailing the night before about ancestral flower fields and fantastical monsters.
    voice: Inebriated. Squawks. "MY OLE HOME IS HAUNTED BY A MONSTER, WON'T ANYONE *HIC* DO ANYTHING?" Dale says she used to sing the classics.
    motivation: Get someone — anyone — to kill the monster in her ancestral flower meadow. Possibly also get her old life back.
    personality: Loud, grief-soaked, willing to pay what little she has left.

    info_shared_with_party:
      - "Her ancestral flower meadow east of Canopia is overgrown and unsafe."
      - "Her solitary bee friends and family are dead or presumed dead — 5 bugs disappeared in one night before she fled."
      - "She fled at the beginning of the Bloom; the meadow should now be full of asters, daisies, and marigolds."
      - "It must be a monster. Will pay what little money she has left."

    party_history:
      - "Session 5: Foreshadowed at the Dewdrop (singing loudly in the background). Not engaged."
      - "Session 6: Met properly at breakfast. Pitched the meadow side quest. Nancy invited her to front the band at the Red Ant Queen's fete — Beeatrix used to sing the classics. Recruitment accepted at the table; follow-through TBD."
      - "Session 6.5: The party cleared the monster (orchid mantis family) from her meadow and returned to Canopia. Her reward not yet collected."
      - "Session 7: Reunion at the Dewdrop. Found her on stage singing a guilt-soaked lament about sending the party to die; Drix joined on lute, Nancy answered with an interpretive dance, and the mood turned warm. Overjoyed they survived. Confirmed as the band's singer (she plays a lyre). Gave Drix the last of her late mother's Stick-All Honey as thanks. Busked the promenade with the band and got into it. The party then talked her into going home rather than the casino, to keep her sober before the fete."

    reward_given:
      - "Stick-All Honey (heirloom; the last of her mother's) — given to Drix. Sticks one thing to one thing, permanently. Single use."
      - "Gold reward: WAIVED (Session 7 DM decision). The honey stands as the reward; the mantis salvage was always the real payout."

    hooks:
      - Does she hold sober at the fete, or crash out? Asset (cover, distraction) vs. liability. The party is actively managing her — sent her home sober this session.
      - The monster turned out to be an orchid mantis family — does she have any reaction when she learns the truth?


