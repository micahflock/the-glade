last_played_session: 7.5
last_played_summary: "The Last Day in Canopia — the morning and afternoon of the fete itself, spent visiting the shops the party had only heard about. Woke at the Dewdrop to Dale's spread of their favorite foods and confirmation that Beeatrix had come back early and sober (she slept through the whole session in the inn's kitchen; Nancy took her measurements while she slept). Drix's Invisible Servant line-holding gambit was walked back as a rules correction. At Trader Twizzlers they skipped a ~40-bug queue by pretending to work there, and Twizzlers -- an elderly bagworm moth in a cocoon chair -- asked THEM for a performance, liked it, and dressed all four: asymmetric purple for Nancy, black-to-purple ombre bellbottoms and a capelet for Drix, all-black-and-spiky WITH SECRET POCKETS for Tabby, and a gown for Beeatrix. At the Ruby Thorax, Thoralex showed them the coronation crown he is finishing -- the centerpiece of tonight -- let slip that he was invited into the Queen's chambers to fit it, and gave up a walking route through her quarters (servants' entrance -> ramp -> great hall -> throne room -> living quarters behind the throne -> spiral to the apartment), including that past the throne it feels like a fortress and that ONE ROOM SMELLS ODD AND RUMBLES/SIZZLES. He finished all their mantis material: Nancy and Drix kept invisibility, Tabby traded it away on BOTH daggers for a master's edge and a balanced edge. Nancy took a sketch of the crown. They found Vikki's Volatiles by accident on the walk -- scorched, boarded, open -- where Vikki (bombardier beetle, bossing around Ricky the house centipede) confirmed she supplies the castle wagons, said her stock has been exploding and behaving strangely, and named the destination: the LEAFCUTTER QUEEN'S LAB. They left armed with 2 exploding peppercorns (20 ft blast), smoke-bomb components, and purple salt. Finally the Royal Jelly Society, which landed exactly as intended: hand-washing water and candy, a branch obsessed with framing flowers, a hostess who cared only about flowers and was uninterested in the Bloom's blight ('She IS TERRIBLE. Literally the worst.' -- Heather's notes), and Mr. Pollendew the archivist, who pointed them to a missive from Chitinholm from a desk of half-written replies. In an old cabinet they found a dusty jar: 'Aged Royal Jelly, Bitmore batch, one dose, do not waste.' Session ended as they exited the RJS, in daylight. The Queen's Crown and the MMA gym did not run, and the party never returned to the Dewdrop -- so Gleam's runner, the six-contacts roster handover, the blueprint threshold, and booking a flyer for exfil ALL still need to happen. See sessions/final/s075_final.md and sessions/session_log.md."


