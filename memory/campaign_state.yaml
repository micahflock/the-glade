last_played_summary: "The City in the Overgrowth — Antshley walked the party through the gradient tunnel, handed Tabby the navi-gus, and parted at the daylight mouth. They followed the pheromone road past leafcutter crews and shimmering fire-ant escorts to the Weevilville, helped Twyla hand out fungus rations, and climbed the ramp into Canopia. They detoured into the Queen's Crown, announced a heist, flubbed a rumor about ants growing fungus on dead bodies to a table of disinterested wasps, and got walked out (Nancy lifted 2 sap and 1 cig on the way). They walked past the Royal Jelly Society's Canopia branch without entering, and ran the dead drop at the Dewdrop Inn cleanly — ginger honeycap, 'it's a hot batch,' a back booth, a clumsy hooded figure with a key. Upstairs, they met Gleam, an earnest weevil rebel contact (table verdict: 'THE CUTEST'). Session ended mid-conversation, before Gleam gave them a concrete plan to reach the Leafcutter Queen. See sessions/session_log.md."


