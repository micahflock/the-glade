creature:
  name: The Red Ant Queen
  size: Huge
  type: Monstrosity (ant)
  alignment: Lawful Evil
  source: >
    original — the fire ant queen of Canopia, warped by the breaking of the
    Brood Coven. Sits at CR 13 against a party of three 6th-level PCs: this is
    not a fight they can take, and the block is built to make that legible in
    round one rather than after somebody dies.

combat:
  ac:
    value: 18
    type: natural armor and coronation regalia
  hp:
    value: 348
    hit_dice: 24d12+192
  speed:
    - 30 ft.
    - climb 30 ft.
  cr:
    rating: 13
    xp: 10000
    proficiency_bonus: 5

ability_scores:
  strength:     { score: 20, modifier: 5 }
  dexterity:    { score: 12, modifier: 1 }
  constitution: { score: 26, modifier: 8 }
  intelligence: { score: 10, modifier: 0 }
  wisdom:       { score: 16, modifier: 3 }
  charisma:     { score: 24, modifier: 7 }

defenses:
  saving_throws:
    - DEX +6
    - CON +13
    - WIS +8
    - CHA +12
  damage_immunities:
    - fire
  condition_immunities:
    - charmed
    - frightened
    - exhaustion
    - prone

senses:
  - darkvision 120 ft.
  - tremorsense 60 ft.
passive_perception: 18
languages:
  - Ant-cant (chemical, absolute — every red ant in the palace hears her)
  - Common

skills:
  - Perception +8
  - Intimidation +12
  - Performance +12
  - Persuasion +12

traits:
  - name: Legendary Resistance (3/Day)
    description: >
      If the Queen fails a saving throw, she can choose to succeed instead.
      This is the trait that tells the players what kind of fight they are in:
      Hypnotic Pattern, Hold Person, and Tasha's Hideous Laughter are the
      party's real win conditions against anything this size, and she simply
      declines the first three.
  - name: Regnal Heat
    description: >
      The air above the Queen bends visibly — she is identifiable from across
      Canopia. Any creature that starts its turn within 15 ft. of her takes
      10 (3d6) fire damage. Flammable objects in that radius that aren't worn
      or carried ignite, and the Throne Room is dried red petal.
  - name: A Hive Unto Herself
    description: >
      An ant queen is not one creature; she is a colony wearing a crown, which
      is what made the Brood Coven possible in the first place. While at least
      one other red ant she can see is within 60 ft., the Queen regains 20 hit
      points at the start of each of her turns. Clear the room of her ants and
      the regeneration stops — which is the only honest path to hurting her,
      and it is a longer job than any one fight allows.
  - name: Vainglory
    description: >
      She has never once been the second most important thing in a room. The
      first time each round that the Queen scores a critical hit or reduces a
      creature to 0 hit points, she pauses to be admired: she gains 20
      temporary hit points, and each creature that can see her must succeed on
      a DC 20 Wisdom saving throw or be Frightened of her until the end of its
      next turn.
  - name: Siege Presence
    description: >
      The Queen's attacks and Crown of Embers deal double damage to objects and
      structures. She does not fight carefully in her own palace, and the
      outward-facing rooms are petal panels.

actions:
  - name: Multiattack
    description: >
      The Queen makes three attacks: three Mandible Rends, or two Mandible
      Rends and one Cinderspit.
  - name: Mandible Rend
    description: >
      Melee Weapon Attack: +10 to hit, reach 15 ft., one target.
      Hit: 22 (4d8+5) slashing damage plus 10 (3d6) fire damage.
  - name: Cinderspit
    description: >
      Ranged Spell Attack: +12 to hit, range 90 ft., one target.
      Hit: 21 (6d6) fire damage, and the target must succeed on a DC 20
      Dexterity saving throw or catch fire, taking 7 (2d6) fire damage at the
      start of each of its turns until it or an adjacent creature uses an
      action to put it out.
  - name: Crown of Embers (Recharge 5–6)
    description: >
      The Queen raises her head and the crown blazes. Every creature within
      30 ft. of her makes a DC 20 Dexterity saving throw, taking 55 (10d10)
      fire damage on a failure or half as much on a success. A creature that
      fails by 5 or more is also knocked prone and drops one held item, which
      lands 10 ft. away.
      Read the damage before you roll it. Fifty-five is more than any of these
      three PCs has, and the point of the action is that they hear the number.

bonus_actions:
  - name: Command the Loyal
    description: >
      One red ant the Queen can see within 60 ft. immediately uses its reaction
      to move up to its speed and make one attack. She never asks twice.

reactions:
  - name: The Queen Is Not Struck
    description: >
      When a creature the Queen can see hits her with an attack, she can force
      one red ant within 10 ft. of her to take the attack's damage instead. The
      ant is not permitted to refuse, and ordinary guards rarely survive it.
      One reaction per round.

legendary_actions:
  budget: 3
  actions:
    - name: Survey the Room
      cost: 1
      description: >
        The Queen looks at one creature within 60 ft. That creature must
        succeed on a DC 20 Wisdom saving throw or be Frightened of her until
        the end of its next turn.
    - name: Sear
      cost: 1
      description: >
        The Queen makes one Cinderspit attack.
    - name: Regnal Flame
      cost: 2
      description: >
        A 15-ft.-radius column of red flame erupts at a point the Queen can see
        within 60 ft. Each creature in it makes a DC 20 Dexterity saving throw,
        taking 21 (6d6) fire damage on a failure or half as much on a success.
        The area burns until the end of her next turn; a creature that enters it
        or ends its turn there takes 10 (3d6) fire damage.
    - name: Call the Brood
      cost: 2
      description: >
        Two Red Ant Guards arrive from an adjoining room, the guard chambers,
        or the Queen's own gaster, and act on her initiative. They feed A Hive
        Unto Herself and The Queen Is Not Struck, so this is her healing and
        her armour as much as it is reinforcement.

lair_actions:
  initiative: 20
  description: >
    On initiative count 20 (losing ties), the Queen takes one lair action. She
    cannot use the same one two rounds running. These only work in the Throne
    Room and the Core.
  actions:
    - name: The Steps Fold
      description: >
        The red petal stair at the room's mouth knits shut, or peels open. The
        Queen chooses one entrance to seal or unseal; a creature on the stair
        when it closes makes a DC 20 Dexterity saving throw, taking 14 (4d6)
        bludgeoning damage and being pushed back into the room on a failure.
        Reopening a sealed way takes an action and a DC 20 Strength check.
    - name: The Walls Take
      description: >
        A 20-ft. section of petal wall ignites — often one of the Red Ant
        Triumph mosaics, so she is watching her own legend burn. Each creature
        within 5 ft. of it makes a DC 20 Dexterity saving throw or takes 17
        (5d6) fire damage. The section becomes lightly obscuring smoke and
        keeps burning for the rest of the encounter.
    - name: The Throne Answers
      description: >
        The floor remembers that the throne rises out of it. The Queen sinks
        into the red petal-stone and rises again anywhere else in the room,
        or a spur of it erupts under one creature she can see: DC 20 Strength
        saving throw or be restrained by closing petals (escape DC 20) until
        the end of its next turn.
    - name: All Eyes On Her
      description: >
        Every painted red ant on every wall turns its head. Each creature in
        the room that is not a red ant makes a DC 20 Charisma saving throw or
        has disadvantage on attack rolls and ability checks until the end of
        its next turn, unable to do anything in that room but be an audience.

regional_effects:
  description: >
    The palace and the ground within a mile of it are warped by her presence.
    These fade over 1d10 days if she dies.
  effects:
    - The heat shimmer above the palace is visible from anywhere in Canopia and
      from the promenade on the west side. Everyone in the city has grown used
      to navigating by it.
    - Fire started within the palace does not go out on its own. It has to be
      smothered, and it spreads along petal panels faster than it should.
    - Red ants within the palace cannot be Frightened while she lives, and know
      the direction she is in at all times.

roleplaying:
  personality: >
    She was always prone to theatrics. Breaking the coven took the theatrics
    and removed everything else holding them up — now she is insane, and
    obsessed with fire and with vanity. She performs constantly, for a room,
    for one bug, for nobody. She is not clever; the Leafcutter Queen is
    explicit that the Red Queen was never smart enough to break the coven
    herself, and that the firepower fell into her hands rather than being
    reached for. She has never worked out that this is true.
  motivation: >
    To be looked at, and to be the one who decides. The alliance, the fete, the
    coronation, the crown Thoralex is finishing for her — all of it is staging.
  tactics: >
    Opens with Crown of Embers if two or more enemies are within 30 ft.,
    because it is the loudest thing she can do. Otherwise she rends whoever is
    closest and spends legendary actions on Survey the Room to keep the party
    saving against Frightened. She spends her ants freely — Call the Brood,
    Command the Loyal, and The Queen Is Not Struck all treat guards as
    consumable, and she will burn a dozen without noticing.
    She does not chase, she does not leave the room, and she will stop to
    monologue at anyone who flatters her — which is the entire opening the
    party has. She would rather be admired than win.
  how_she_actually_falls: >
    Not in a fight, and not by this party at this level. Killing her takes a
    separate plot: a coalition, poison, cutting her off from her own colony so
    A Hive Unto Herself stops carrying her, or the vanity that makes her stand
    in a burning room to be watched. Statted here so that if the party ever
    does corner her, the numbers exist — at level 12 with allies this is a
    real boss fight rather than an execution.
