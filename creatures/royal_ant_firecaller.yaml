creature:
  name: Royal Ant Firecaller
  size: Medium
  type: Monstrosity (ant)
  alignment: Lawful Neutral
  source: original — the Red Ant Queen's elite. The support half of the royal response squad; never dispatched without at least one Bulwark.

combat:
  ac:
    value: 15
    type: chitin and censer-regalia
  hp:
    value: 78
    hit_dice: 12d8+24
  speed:
    - 30 ft.
    - climb 30 ft.
  cr:
    rating: 3
    xp: 700
    proficiency_bonus: 2
    note: >
      Rated on force multiplication, not on its own damage. By its own numbers
      this block is a CR 1–2 creature; a Firecaller behind six Kindled guards
      is not. It is never deployed alone, so rate it in the squad it arrives
      with. See royal_ant_bulwark.yaml and red_ant_guard.yaml.

ability_scores:
  strength:     { score: 10, modifier: 0 }
  dexterity:    { score: 14, modifier: 2 }
  constitution: { score: 14, modifier: 2 }
  intelligence: { score: 14, modifier: 2 }
  wisdom:       { score: 16, modifier: 3 }
  charisma:     { score: 14, modifier: 2 }

defenses:
  saving_throws:
    - CON +4
    - WIS +5
  damage_resistances:
    - fire

senses:
  - darkvision 60 ft.
  - tremorsense 30 ft.
passive_perception: 15
languages:
  - Ant-cant (chemical, fluent)
  - Common

skills:
  - Perception +5
  - Insight +5

traits:
  - name: Pheromone Standard
    description: >
      Spell save DC 13, spell attack +5. Allied ants within 30 ft. of the
      Firecaller can't be Frightened and have advantage on saving throws
      against being Charmed. Ordinary guards do not break while it is standing.
  - name: Royal Chitin
    description: >
      Overkill (Cleave) damage never carries to or from a Firecaller.

actions:
  - name: Kindle the Host
    description: >
      The Firecaller opens its censer and breathes over up to three allied ants
      it can see within 30 ft. Each becomes Kindled for 1 minute: its carapace
      runs hot enough to read by, and any creature that is not a red ant and
      ends its turn within 5 ft. of it takes 2 (1d4) fire damage. This damage is
      rolled per Kindled ant — a creature ending its turn inside a knot of three
      Kindled guards rolls 3d4, averaging 7–8.
      Kindled ends early on any ant that drops, and ends on ALL of them the
      instant the Firecaller dies. This is the block's main action and usually
      its whole first turn.
  - name: Cinder Bolt
    description: >
      Ranged Spell Attack: +5 to hit, range 60 ft., one target.
      Hit: 10 (3d6) fire damage. What it does on the turns it has nobody left
      worth heating. There is no multiattack — this creature is not a nuke.

bonus_actions:
  - name: Royal Cadence
    description: >
      Up to three allied ants within 30 ft. that can smell the Firecaller each
      gain 5 temporary hit points. Temporary hit points from Royal Cadence stop
      an Overkill (Cleave) chain — excess damage is absorbed rather than passed
      on. This is the deliberate counter to the party mowing down Red Ant
      Guards, and it costs the Firecaller its bonus action every round it wants it.
  - name: Volunteer
    description: >
      The Firecaller lays a claw on one Red Ant Guard within 30 ft. and names
      it. That guard immediately becomes Charged (as Stoke the Gaster) without
      spending its own action, and its speed is not reduced; it can use Ember
      Lance on its own next turn.
      Ember Lance kills the guard that fires it, and both of them know that.
      An ordinary guard will not stoke its own gaster in a fight it expects to
      survive — this is how the lance actually reaches the table, and it is the
      Firecaller spending a life to do it.

roleplaying:
  personality: >
    Composed where the ordinary guards are frantic. Speaks — actually speaks,
    aloud, in Common — which is itself alarming to anyone who has spent the
    night being handled by jumpy post guards. Polite to the guards it is about
    to spend, and not cruel about it; this is simply what they are for.
  motivation: >
    Contain and account for. A Firecaller wants to know what happened and who
    saw it, and would rather bring back a live intruder than a dead one.
  tactics: >
    Stays behind the Bulwarks and holds 30 ft. Turn one is Kindle the Host on
    whichever three guards are closest to the party, plus Volunteer on a guard
    with a clean lane. Turn two heats three more and starts Royal Cadence once
    the party begins dropping mooks. Cinder Bolt only when there is nothing
    left to buff. Does not chase, does not press a losing fight, and will fall
    back to call the next batch — its job is to make the swarm expensive, not
    to win the fight itself.
