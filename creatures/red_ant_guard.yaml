creature:
  name: Red Ant Guard
  size: Medium
  type: Monstrosity (ant)
  alignment: Lawful Neutral
  source: original — the Red Ant Queen's ordinary fête/patrol guard (NOT her elite; see royal_ant_bulwark.yaml and royal_ant_firecaller.yaml)

combat:
  ac:
    value: 14
    type: chitin and ceremonial plate
  hp:
    value: 18
    hit_dice: 4d8
  speed:
    - 30 ft.
    - climb 30 ft.
  cr:
    rating: "1/2"
    xp: 100
    proficiency_bonus: 2

ability_scores:
  strength:     { score: 14, modifier: 2 }
  dexterity:    { score: 12, modifier: 1 }
  constitution: { score: 10, modifier: 0 }
  intelligence: { score: 8,  modifier: -1 }
  wisdom:       { score: 12, modifier: 1 }
  charisma:     { score: 10, modifier: 0 }

senses:
  - darkvision 60 ft.
  - tremorsense 30 ft.
passive_perception: 15   # 10 while standing its post in a public room — see Overexcited
languages:
  - Ant-cant (chemical)

skills:
  - Perception +5   # doubled proficiency — it never stops scanning

traits:
  - name: Overexcited
    description: >
      This guard is watching everything, all at once, and has been all night.
      It startles at a dropped tray, at laughter, at movement in the petal
      panels. It notices an enormous amount and can tell almost none of it
      apart. While it is standing its post in a public room it makes Wisdom
      (Perception) checks with disadvantage — passive Perception 10, because
      every single thing it has flagged so far tonight has been nothing.
      Back-corridor patrols away from the crowd use the full 15.
  - name: Overkill (Cleave)
    description: >
      When a single attack reduces a Red Ant Guard to 0 hit points, damage in
      excess of its remaining hit points carries over to one other Red Ant Guard
      within 5 ft. of it, and can chain onward the same way while excess remains.
      Overkill damage never carries to or from a Royal Ant Bulwark, a Royal Ant
      Firecaller, or any non-ant creature. Temporary hit points (see the
      Firecaller's Royal Cadence) stop the chain — excess is absorbed, not passed.

actions:
  - name: Mandible Jab
    description: >
      Melee Weapon Attack: +4 to hit, reach 5 ft., one target.
      Hit: 6 (1d8+2) piercing damage.
  - name: Stoke the Gaster
    description: >
      The guard plants its legs and pumps its fire gland. Its abdomen swells,
      glows, and hisses — anyone who can see it knows exactly what is coming,
      and so does the guard. Until the end of its next turn the guard is
      Charged, and its speed is 0. If it takes 5 or more damage from a single
      source while Charged, the charge ruptures: the charge is lost and the
      guard takes 7 (2d6) fire damage — which is, from the guard's side of it,
      a reprieve. Round one of the two-round charged attack.
  - name: Ember Lance (Charged only)
    description: >
      The guard vents its charged gaster in a line 30 ft. long and 5 ft. wide.
      Each creature in the line makes a DC 12 Dexterity saving throw, taking
      21 (6d6) fire damage on a failure or half as much on a success. Flammable
      objects in the line that aren't worn or carried ignite — and the
      outward-facing palace is built of dried flower petals.
      THE GUARD DOES NOT SURVIVE IT. Venting the gland burns it hollow from the
      inside; the guard drops to 0 hit points and dies as the lance goes out,
      leaving a husk that goes on burning for a minute and will light whatever
      it is lying against. Every red ant knows this is what the lance costs.
      Round two — and the last round — of the two-round charged attack.

roleplaying:
  personality: >
    Wound far too tight. Head snapping at every noise, challenging guests who
    reach for a canapé too quickly, apologizing, then doing it again. They were
    picked for how they look flanking an aperture, not for how they fight, and
    they know it. The palace has always been safe, which is why nobody — least
    of all them — trusts a word they say about what they just saw.
  motivation: >
    Get through the shift, do not be the one who let something happen during
    the coronation.
  tactics: >
    On post, two to an aperture, facing outward. In the open they fight in
    numbers and stand their ground rather than disengaging — they hold the line
    and make noise while they do it, which is what summons the royal squad.
    Left to themselves they jab, because Ember Lance kills them and they know
    it. A guard stokes its gaster under three conditions and no others: a
    Firecaller orders it (Volunteer), a superior is watching and it has already
    failed once tonight, or it is going to die anyway and can take someone with
    it. That makes the lance rare and dreadful rather than routine — and it
    means the moment a gaster starts to glow, the party is looking at an ant
    that has just been spent.
